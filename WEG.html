<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>WEG - Contrato</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <button onclick="fazerLogout()">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>


<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="card">

        <h2>Contrato WEG</h2>

        <p style="color:#94a3b8; font-size:13px; margin-top:-8px;">
            Preços fixos em contrato. Cada período = 30 dias. Frete bonificado a partir de 4 períodos.
        </p>

        <hr>

        <!-- EQUIPAMENTOS -->

        <div id="listaEquipamentosWEG"></div>

        <hr>

        <!-- FRETE -->

        <div class="agendamento-linha">
            <label>Unidade WEG (frete):</label>
            <select id="unidadeWEG"></select>
        </div>

        <div class="agendamento-linha">
            <label>Valor do frete:</label>
            <input
                type="text"
                id="valorFrete"
                placeholder="Ex: 450,00"
            >
        </div>

        <hr>

        <!-- PERÍODOS -->

        <div class="agendamento-linha">
            <label>Períodos (30 dias):</label>
            <input
                type="number"
                id="periodos"
                value="1"
                min="1"
                step="1"
            >
        </div>

        <!-- DATAS -->

        <div class="agendamento-linha">
            <label>Data início:</label>
            <input
                type="date"
                id="dataInicio"
            >
        </div>

    </div>


    <!-- =========================
    DOCUMENTO (área pra print)
    ========================= -->

    <div class="coluna-documento">

        <!-- fora da área de print: texto pra mandar junto no e-mail -->
        <button
            class="btn-copiar-email"
            onclick="copiarParaEmail()"
            title="Copia a saudação e os dados para confirmação"
        >📋 Copiar texto do e-mail</button>

        <div
            id="documentoProposta"
            class="documento-proposta"
        ></div>

    </div>

</div>


<div id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-guard.js"></script>

<script src="js/helpers.js"></script>
<script src="js/menu.js"></script>
<script src="js/weg-dados.js"></script>
<script src="js/weg-documento.js"></script>
<script src="js/weg-cache.js"></script>
<script src="js/weg-email.js"></script>
<script src="js/weg-init.js"></script>

</body>

</html>
