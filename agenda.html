<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Agenda</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

<style>
/* ===== Agenda ===== */
/* o card se ajusta ao conteúdo (não estica em tela grande) */
.card-agenda{
    width:fit-content;
    min-width:min(100%, 900px);
    max-width:100%;
    text-align:left;
}
.barra-agenda{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}
.barra-agenda select{
    width:auto;
    margin:0;
    flex:1;
    min-width:140px;
}
.barra-agenda button{
    margin:0;
}
.btn-secundario{
    background:#475569;
}
.btn-secundario:hover{
    background:#334155;
}
.btn-perigo{
    background:#dc2626;
}
.btn-perigo:hover{
    background:#b91c1c;
}
/* ===== Filtro de datas (estilo Excel) ===== */
.filtro-datas,
.filtro-status{
    position:relative;
}
.filtro-datas > button.filtrando,
.filtro-status > button.filtrando{
    background:#2563eb;
}
.painel-datas,
.painel-status{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    z-index:60;
    width:300px;
    max-width:90vw;
    padding:10px;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.painel-datas.aberto,
.painel-status.aberto{
    display:block;
}
.painel-status{
    width:250px;
}
.contagem-status{
    margin-left:auto;
    font-size:12px;
    color:#94a3b8;
}
.atalhos-datas{
    display:flex;
    gap:6px;
    margin-bottom:8px;
}
.atalhos-datas button{
    margin:0;
    padding:6px 10px;
    font-size:12px;
}
.painel-datas input[type="text"]{
    margin:0 0 8px;
    padding:6px 8px;
    font-size:13px;
}
.data-opcao{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 6px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
}
.data-opcao:hover{
    background:#334155;
}
.data-opcao input{
    width:auto;
    margin:0;
    padding:0;
}
.data-todas{
    font-weight:bold;
    border-bottom:1px solid #334155;
    border-radius:6px 6px 0 0;
}
.lista-datas{
    max-height:260px;
    overflow-y:auto;
    padding-top:4px;
}

.chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
}
.chip{
    margin:0;
    padding:8px 14px;
    background:#334155;
}
.chip:hover{
    background:#475569;
}
.chip.ativo{
    background:#2563eb;
}
.contagem-agenda{
    color:#94a3b8;
    font-size:13px;
    margin:0 0 8px;
}
.agenda-vazia{
    color:#94a3b8;
    text-align:center;
    padding:24px 0;
}

.modos{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:10px;
}
.modo-btn{
    margin:0;
    padding:10px 22px;
    background:#334155;
}
.modo-btn:hover{
    background:#475569;
}
.modo-btn.ativo{
    background:#2563eb;
}
.dica-modo{
    margin:0 0 10px;
    font-size:12px;
    color:#94a3b8;
    text-align:center;
}

/* ===== Lista (tabela: as colunas se ajustam ao texto e ficam alinhadas) ===== */
#listaAgenda{
    overflow-x:auto;
}
.ag-tabela{
    border-collapse:separate;
    border-spacing:0 3px;
    width:auto;
    max-width:100%;
}
.ag-tabela p{
    margin:0;
}
.ag-tabela thead th{
    padding:4px 10px;
    font-size:11px;
    font-weight:bold;
    text-align:left;
    text-transform:uppercase;
    color:#94a3b8;
    border-bottom:1px solid #334155;
    white-space:nowrap;
}
.ag-tabela thead th + th{
    border-left:1px dashed #475569;
}
.ag-tabela thead th.ag-cab-horario{
    text-align:center;
}
/* título arrastável (muda a ordem das colunas) */
.ag-tabela thead th.ag-cab-coluna{
    cursor:grab;
    user-select:none;
}
.ag-tabela thead th.ag-cab-coluna:hover{
    color:#e5e7eb;
}
.ag-tabela thead th.arrastando{
    opacity:.4;
}
.ag-tabela thead th.solta-antes{
    box-shadow:inset 3px 0 0 #3b82f6;
}
.ag-tabela thead th.solta-depois{
    box-shadow:inset -3px 0 0 #3b82f6;
}
.ag-tabela thead th.ag-cab-proposta{
    border-left:2px dashed #334155;
    text-align:center;
}
.ag-tabela thead th.ag-cab-lado{
    border:none;
}

/* cabeçalho de cada dia (a cor do dia vem da variável --cor-dia) */
tr.ag-dia{
    --cor-dia:#94a3b8;
}
tr.ag-dia th{
    padding:3px 12px;
    font-size:14px;
    text-align:left;
    text-transform:capitalize;
    background:var(--cor-dia);
    color:#0f172a;
    border-radius:6px;
    background-clip:padding-box;
}
tr.ag-dia:not(:first-child) th{
    border-top:8px solid transparent;
}

/* linha de cada agendamento */
tr.ag-item{
    --cor-dia:#94a3b8;
}
tr.ag-item td{
    padding:2px 10px;
    font-size:13px;
    line-height:1.25;
    vertical-align:middle;
    background:#0f172a;
    background:color-mix(in srgb, var(--cor-dia) 16%, #0f172a);
    border-top:1px solid var(--cor-dia);
    border-bottom:1px solid var(--cor-dia);
}
tr.ag-item td + td{
    border-left:1px dashed #475569;
}
tr.ag-item td:first-child{
    border-left:6px solid var(--cor-dia);
    border-radius:8px 0 0 8px;
}
tr.ag-item td:last-child{
    border-right:1px solid var(--cor-dia);
    border-radius:0 8px 8px 0;
}
tr.ag-item[data-status="Cancelado"] td,
tr.ag-item[data-status="Concluído"] td{
    opacity:.55;
}
.ag-conteudo{
    overflow-wrap:anywhere;
}
/* colunas curtas (período, status, motorista...): nunca quebram de linha */
.ag-sem-quebra{
    white-space:nowrap;
}
.ag-hora{
    font-weight:bold;
    font-size:14px;
    text-align:center;
    white-space:nowrap;
}
.ag-hora.ag-hora-texto{
    font-size:11px;
}
.ag-patrimonio{
    font-weight:bold;
}

/* status: a própria etiqueta troca o status ao clicar */
tr.ag-item select.tag-select{
    -webkit-appearance:none;
    appearance:none;
    width:auto;
    margin:0;
    padding:1px 9px;
    border:none;
    border-radius:999px;
    font-family:inherit;
    font-size:11px;
    font-weight:bold;
    color:#e5e7eb;
    text-align:center;
    cursor:pointer;
}
tr.ag-item select.tag-select option{
    background:#0f172a;
    color:#e5e7eb;
}
.tag{
    display:inline-block;
    padding:1px 8px;
    border-radius:999px;
    background:#334155;
    color:#e5e7eb;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}
.tag[data-tipo="Entrega"]{
    background:#1d4ed8;
}
.tag[data-tipo="Coleta"]{
    background:#b45309;
}
.tag[data-tipo="Transferência"]{
    background:#7e22ce;
}
.tag[data-tipo="Troca técnica"]{
    background:#0f766e;
}
.tag.sem-transp{
    background:#991b1b;
}
.tag[data-status="A confirmar"]{
    background:#a16207;
}
.tag[data-status="Confirmado"]{
    background:#1d4ed8;
}
.tag[data-status="Em rota"]{
    background:#c2410c;
}
.tag[data-status="Concluído"]{
    background:#15803d;
}
.tag[data-status="Cancelado"]{
    background:#475569;
}

.ag-local{
    display:flex;
    flex-direction:column;
    gap:1px;
}
.ag-local-texto{
    font-weight:bold;
    color:#e5e7eb;
}
.ag-local-endereco{
    color:#cbd5e1;
}
.ag-link{
    display:block;
    font-size:11px;
    color:#60a5fa;
    word-break:break-all;
}
.ag-extra{
    color:#cbd5e1;
}

/* proposta e botões da linha: ficam à direita do traço de corte,
   fora da área do print */
tr.ag-item td.ag-proposta{
    padding-left:14px;
    padding-right:14px;
    font-size:12px;
    color:#cbd5e1;
    text-align:center;
    white-space:nowrap;
    border-left:2px dashed #334155;
}
tr.ag-item td.ag-lado{
    padding-left:14px;
    border-left:1px dashed #475569;
}
.ag-botoes{
    display:flex;
    gap:16px;
    align-items:center;
}
.ag-botoes button{
    margin:0;
    padding:5px 10px;
}
.ag-botoes .btn-zap{
    background:#16a34a;
}
.ag-botoes .btn-zap:hover{
    background:#15803d;
}
.ag-botoes .btn-coleta{
    background:#b45309;
}
.ag-botoes .btn-coleta:hover{
    background:#92400e;
}
.ag-botoes .btn-excluir-ag{
    margin-left:12px;
}

/* ===== Modal ===== */
.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:1100;
    background:rgba(0,0,0,.6);
    align-items:center;
    justify-content:center;
    padding:16px;
}
.modal-overlay.aberto{
    display:flex;
}
.modal-agenda{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}
/* cabeçalho fixo: o Salvar acompanha quando o formulário rola */
.modal-agenda-topo{
    position:sticky;
    top:0;
    z-index:5;
    display:flex;
    flex-wrap:wrap;
    gap:8px 12px;
    align-items:center;
    justify-content:space-between;
    padding:12px 20px;
    background:#1e293b;
    border-bottom:1px solid #334155;
}
.modal-agenda-topo h3{
    margin:0;
}
.modal-titulo{
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
    align-items:baseline;
}
.aviso-rascunho{
    font-size:12px;
    color:#fbbf24;
}
.modal-acoes{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
}
.modal-acoes button{
    margin:0;
    padding:8px 14px;
}
.modal-agenda .btn-fechar{
    margin:0;
    padding:2px 10px;
    font-size:20px;
}
.modal-corpo{
    padding:14px 20px 20px;
}
.form-grade{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 10px;
    padding:14px 20px 20px;
}
.form-grade label{
    display:block;
    font-size:12px;
    color:#94a3b8;
    margin-bottom:2px;
}
.form-grade .largo{
    grid-column:1 / -1;
}
.subtitulo-form{
    margin:10px 0 4px;
    font-size:13px;
    font-weight:bold;
    color:#cbd5e1;
}

/* ===== Cadastro de transportadoras e motoristas ===== */
.modal-motoristas{
    max-width:440px;
}
.modal-agenda label.rotulo-modal{
    display:block;
    font-size:12px;
    color:#94a3b8;
    margin-bottom:2px;
}
.sep-modal{
    margin:14px 0;
    border:none;
    border-top:1px solid #334155;
}
.mot-linha{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 10px;
    margin-bottom:5px;
    background:#0f172a;
    border:1px solid #334155;
    border-radius:8px;
}
.mot-linha button{
    margin:0;
    padding:4px 10px;
}
.mot-vazio{
    color:#94a3b8;
    font-size:13px;
    padding:8px 0;
}
.mot-novo{
    display:flex;
    gap:8px;
    margin-top:10px;
}
.mot-novo input{
    margin:0;
    flex:1;
}
.mot-novo button{
    margin:0;
}

@media(max-width:600px){
    .form-grade{
        grid-template-columns:1fr;
    }
}

/* ===== Fundo claro (opção, escolhida no botão da barra) ===== */
/* tons pastéis: se quiser mais claro ou mais escuro, é só mexer nestas cores */
body.tema-claro{
    --claro-fundo:#d3deed;      /* fundo da página */
    --claro-card:#e3ebf6;       /* card, formulários e modais */
    --claro-campo:#f1f5fb;      /* campos de digitação */
    --claro-linha:#9db0ca;      /* bordas e traços */
    --claro-botao:#bccbe1;      /* botões neutros (filtros, modos) */
    --claro-mistura:42%;        /* quanto da cor do dia entra no fundo da linha */
    background:var(--claro-fundo);
    color:#0f172a;
}
body.tema-claro .card{
    background:var(--claro-card);
    box-shadow:0 8px 22px rgba(30,41,59,.14);
}
body.tema-claro input,
body.tema-claro select{
    background:var(--claro-campo);
    color:#0f172a;
    border-color:var(--claro-linha);
}
body.tema-claro .contagem-agenda,
body.tema-claro .dica-modo,
body.tema-claro .agenda-vazia,
body.tema-claro .mot-vazio{
    color:#52617a;
}
body.tema-claro .chip,
body.tema-claro .modo-btn{
    background:var(--claro-botao);
    color:#0f172a;
}
body.tema-claro .chip:hover,
body.tema-claro .modo-btn:hover{
    background:var(--claro-linha);
}
body.tema-claro .chip.ativo,
body.tema-claro .modo-btn.ativo{
    background:#2563eb;
    color:#ffffff;
}
body.tema-claro .ag-tabela thead th{
    color:#3b4a63;
    border-bottom-color:var(--claro-linha);
}
body.tema-claro .ag-tabela thead th + th,
body.tema-claro tr.ag-item td + td,
body.tema-claro .ag-tabela thead th.ag-cab-proposta,
body.tema-claro tr.ag-item td.ag-proposta,
body.tema-claro tr.ag-item td.ag-lado{
    border-left-color:var(--claro-linha);
}
body.tema-claro tr.ag-dia th{
    background:var(--cor-dia);
    background:color-mix(in srgb, var(--cor-dia) 78%, var(--claro-card));
}
body.tema-claro tr.ag-item td{
    background:var(--claro-card);
    background:color-mix(in srgb, var(--cor-dia) var(--claro-mistura), var(--claro-card));
    color:#0f172a;
}
body.tema-claro tr.ag-item td.ag-proposta{
    color:#3b4a63;
}
body.tema-claro tr.ag-item select.tag-select option{
    background:var(--claro-campo);
    color:#0f172a;
}
body.tema-claro .ag-local-texto{
    color:#0f172a;
}
body.tema-claro .ag-local-endereco,
body.tema-claro .ag-extra{
    color:#2c3a52;
}
body.tema-claro .ag-link{
    color:#1d4ed8;
}
body.tema-claro .modal-agenda{
    background:var(--claro-card);
    border-color:var(--claro-linha);
}
body.tema-claro .modal-agenda-topo{
    background:var(--claro-card);
    border-bottom-color:var(--claro-linha);
}
body.tema-claro .form-grade label,
body.tema-claro .modal-agenda label.rotulo-modal{
    color:#3b4a63;
}
body.tema-claro .subtitulo-form{
    color:#2c3a52;
}
body.tema-claro .aviso-rascunho{
    color:#a14a09;
}
body.tema-claro .mot-linha{
    background:var(--claro-campo);
    border-color:var(--claro-linha);
}
body.tema-claro .contagem-status{
    color:#52617a;
}
body.tema-claro .painel-datas,
body.tema-claro .painel-status{
    background:var(--claro-card);
    border-color:var(--claro-linha);
}
body.tema-claro .data-opcao:hover{
    background:var(--claro-botao);
}
body.tema-claro .data-todas{
    border-bottom-color:var(--claro-linha);
}
body.tema-claro .ag-tabela thead th.ag-cab-coluna:hover{
    color:#0f172a;
}
body.tema-claro .sep-modal{
    border-top-color:var(--claro-linha);
}
</style>

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <!-- links das outras páginas: montados pelo js/menu.js -->

    <button onclick="fazerLogout()">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>

<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="card card-agenda">

        <h2 style="text-align:center">Agenda</h2>

        <div class="modos">

            <button
                type="button"
                id="btnModoExpedicao"
                class="modo-btn"
                onclick="definirModo('expedicao')"
            >
                🏭 Expedição
            </button>

            <button
                type="button"
                id="btnModoTransportador"
                class="modo-btn"
                onclick="definirModo('transportador')"
            >
                🚚 Transportador
            </button>

        </div>

        <p class="dica-modo" id="dicaModo"></p>

        <div class="barra-agenda">

            <button type="button" onclick="abrirModalAgenda()">
                + Novo agendamento
            </button>

            <button
                type="button"
                class="btn-secundario"
                onclick="abrirModalMotoristas()"
            >
                🚚 Transportadoras e motoristas
            </button>

            <!-- filtro de datas estilo Excel: lista com caixinhas -->
            <div class="filtro-datas">

                <button
                    type="button"
                    id="btnDatas"
                    class="btn-secundario"
                    onclick="alternarPainelDatas()"
                >
                    📅 Todas as datas ▾
                </button>

                <div class="painel-datas" id="painelDatas">

                    <div class="atalhos-datas">

                        <button
                            type="button"
                            class="btn-secundario"
                            onclick="selecionarProximosDias(0)"
                        >
                            Só hoje
                        </button>

                        <button
                            type="button"
                            class="btn-secundario"
                            onclick="selecionarProximosDias(7)"
                        >
                            Próximos 7 dias
                        </button>

                    </div>

                    <input
                        type="text"
                        id="buscaDatas"
                        placeholder="Buscar data..."
                        autocomplete="off"
                    >

                    <label class="data-opcao data-todas">
                        <input type="checkbox" id="marcarTodasDatas">
                        <span>(Selecionar tudo)</span>
                    </label>

                    <div class="lista-datas" id="listaDatasFiltro"></div>

                </div>

            </div>

            <select id="filtroTipo">
                <option value="">Todos os tipos</option>
            </select>

            <!-- filtro de status igual ao de datas: lista com caixinhas -->
            <div class="filtro-status">

                <button
                    type="button"
                    id="btnStatus"
                    class="btn-secundario"
                    onclick="alternarPainelStatus()"
                >
                    🏷️ Todos os status ▾
                </button>

                <div class="painel-status" id="painelStatus">

                    <label class="data-opcao data-todas">
                        <input type="checkbox" id="marcarTodosStatus">
                        <span>(Selecionar tudo)</span>
                    </label>

                    <div class="lista-datas" id="listaStatusFiltro"></div>

                </div>

            </div>

            <select id="ordemAgenda" title="Ordem dentro de cada data"></select>

            <button
                type="button"
                class="btn-secundario"
                onclick="recarregarAgenda(true)"
                title="Buscar de novo os agendamentos e motoristas"
            >
                ↻ Atualizar
            </button>

            <button
                type="button"
                class="btn-secundario"
                id="btnColunasPadrao"
                style="display:none"
                onclick="restaurarOrdemColunas()"
                title="Voltar as colunas para a ordem padrão"
            >
                ↺ Colunas padrão
            </button>

            <button
                type="button"
                class="btn-secundario"
                id="btnTema"
                onclick="alternarTema()"
                title="Trocar entre fundo escuro e fundo claro"
            >
                ☀️ Fundo claro
            </button>

        </div>

        <div class="chips" id="chipsTransportadora"></div>

        <p class="contagem-agenda" id="contagemAgenda"></p>

        <div id="listaAgenda"></div>

    </div>

</div>

<!-- =========================
MODAL (novo / editar)
========================= -->

<div
    id="modalAgenda"
    class="modal-overlay"
    onclick="if(event.target === this) fecharModalAgenda()"
>

    <div class="modal-agenda">

        <div class="modal-agenda-topo">

            <div class="modal-titulo">

                <h3 id="tituloModalAgenda">Novo agendamento</h3>

                <span class="aviso-rascunho" id="avisoRascunho" style="display:none"></span>

            </div>

            <div class="modal-acoes">

                <button type="button" id="btnSalvarAgenda" onclick="salvarAgendamento()">
                    💾 Salvar
                </button>

                <button
                    type="button"
                    id="btnDescartarAgenda"
                    class="btn-secundario"
                    onclick="descartarRascunho()"
                >
                    🗑️ Descartar rascunho
                </button>

                <button
                    type="button"
                    id="btnExcluirAgenda"
                    class="btn-perigo"
                    style="display:none"
                    onclick="excluirAgendamentoAberto()"
                >
                    🗑️ Excluir agendamento
                </button>

                <button
                    type="button"
                    class="btn-fechar"
                    onclick="fecharModalAgenda()"
                    title="Fechar (o que foi digitado fica guardado como rascunho)"
                >
                    ×
                </button>

            </div>

        </div>

        <div class="form-grade">

            <div>
                <label for="agData">Data</label>
                <input type="date" id="agData">
            </div>

            <div>
                <label for="agHorario">Horário</label>
                <input
                    type="text"
                    id="agHorario"
                    list="listaHorarios"
                    maxlength="9"
                    autocomplete="off"
                    placeholder="08:00, CONFIRMAR ou IMEDIATO"
                >
            </div>

            <div>
                <label for="agTipo">Tipo</label>
                <select id="agTipo"></select>
            </div>

            <div>
                <label for="agStatus">Status</label>
                <select id="agStatus"></select>
            </div>

            <div>
                <label for="agPlataforma" id="rotuloPlataforma">Plataforma</label>
                <input type="text" id="agPlataforma" autocomplete="off" placeholder="Ex: WAE16010">
            </div>

            <div>
                <label for="agTransportadora">Transportadora</label>
                <select id="agTransportadora"></select>
            </div>

            <div class="largo" id="blocoRecolha" style="display:none">
                <label for="agPlataformaRecolha">Máquina de recolha (volta com a troca)</label>
                <input type="text" id="agPlataformaRecolha" autocomplete="off" placeholder="Ex: WTE10014">
            </div>

            <div>
                <label for="agCliente">Cliente</label>
                <input type="text" id="agCliente" placeholder="Nome do cliente">
            </div>

            <div>
                <label for="agMotorista">Motorista</label>
                <select id="agMotorista"></select>
            </div>

            <div>
                <label for="agProposta">Nº da proposta</label>
                <input type="text" id="agProposta">
            </div>

            <div>
                <label for="agPeriodo">Período</label>
                <input
                    type="text"
                    id="agPeriodo"
                    list="listaPeriodos"
                    autocomplete="off"
                    placeholder="16 dias, 3 períodos ou Anual"
                >
            </div>

            <p class="largo subtitulo-form">
                📍 Retirada (vazio em entrega e troca = W Rental)
            </p>

            <div class="largo">
                <label for="agOrigemNome">Nome do local</label>
                <input type="text" id="agOrigemNome" placeholder="Ex: Obra A">
            </div>

            <div class="largo">
                <label for="agOrigemEndereco">Endereço completo</label>
                <input type="text" id="agOrigemEndereco" placeholder="Ex: Rua A, 100, Fazenda, Itajaí/SC">
            </div>

            <div class="largo">
                <label for="agLinkOrigem">Link (opcional)</label>
                <input type="text" id="agLinkOrigem" placeholder="https://maps...">
            </div>

            <p class="largo subtitulo-form">
                📍 Entrega (vazio em coleta = W Rental)
            </p>

            <div class="largo">
                <label for="agDestinoNome">Nome do local</label>
                <input type="text" id="agDestinoNome" placeholder="Ex: Cliente X">
            </div>

            <div class="largo">
                <label for="agDestinoEndereco">Endereço completo</label>
                <input type="text" id="agDestinoEndereco" placeholder="Ex: Rua B, 200, Centro, Brusque/SC">
            </div>

            <div class="largo">
                <label for="agLinkDestino">Link (opcional)</label>
                <input type="text" id="agLinkDestino" placeholder="https://maps...">
            </div>

            <div>
                <label for="agFrete">Frete (R$)</label>
                <input type="text" id="agFrete" placeholder="Ex: 450,00">
            </div>

            <div>
                <label for="agFreteConta">Frete por conta de</label>
                <select id="agFreteConta">
                    <option value="nossa">Nossa conta</option>
                    <option value="cliente">Conta do cliente</option>
                </select>
            </div>

            <div class="largo">
                <label for="agObsExpedicao">Obs. para a expedição</label>
                <input type="text" id="agObsExpedicao">
            </div>

            <div class="largo">
                <label for="agObsEntrega">Obs. para a entrega (transportador)</label>
                <input type="text" id="agObsEntrega">
            </div>

            <p class="largo subtitulo-form">
                💬 Mensagem do Zap
            </p>

            <div class="largo">
                <label for="agReferencia">Referência (ficha / proposta — digitada à mão)</label>
                <input type="text" id="agReferencia" placeholder="Ficha / referência">
            </div>

            <div class="largo">
                <label for="agContato">Contato de quem vai receber</label>
                <input type="text" id="agContato" placeholder="Nome e telefone">
            </div>

            <div class="largo" id="blocoCard">
                <label for="agCard">Card</label>
                <input type="text" id="agCard">
            </div>

            <div class="largo" id="blocoEmails">
                <label for="agEmails">E-mails do cliente (financeiro)</label>
                <input type="text" id="agEmails" placeholder="a@cliente.com; b@cliente.com">
            </div>

        </div>

    </div>

</div>

<datalist id="listaHorarios">
    <option value="CONFIRMAR">
    <option value="IMEDIATO">
</datalist>

<datalist id="listaPeriodos"></datalist>

<!-- =========================
MODAL (cadastro de transportadoras e motoristas)
========================= -->

<div
    id="modalMotoristas"
    class="modal-overlay"
    onclick="if(event.target === this) fecharModalMotoristas()"
>

    <div class="modal-agenda modal-motoristas">

        <div class="modal-agenda-topo">

            <h3>🚚 Transportadoras e motoristas</h3>

            <button
                type="button"
                class="btn-fechar"
                onclick="fecharModalMotoristas()"
                title="Fechar"
            >
                ×
            </button>

        </div>

        <div class="modal-corpo">

            <p class="subtitulo-form" style="margin-top:0">Transportadoras</p>

            <div id="listaTransportadorasCadastro"></div>

            <div class="mot-novo">

                <input
                    type="text"
                    id="transNome"
                    placeholder="Nome da transportadora"
                >

                <button type="button" onclick="adicionarTransportadora()">
                    Adicionar
                </button>

            </div>

            <hr class="sep-modal">

            <p class="subtitulo-form" style="margin-top:0">Motoristas</p>

            <label class="rotulo-modal" for="motTransportadora">Transportadora</label>

            <select id="motTransportadora"></select>

            <div id="listaMotoristasCadastro"></div>

            <div class="mot-novo">

                <input
                    type="text"
                    id="motNome"
                    placeholder="Nome do motorista"
                >

                <button type="button" onclick="adicionarMotorista()">
                    Adicionar
                </button>

            </div>

        </div>

    </div>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-guard.js"></script>

<script src="js/helpers.js"></script>
<script src="js/menu.js"></script>
<script src="js/agenda.js"></script>

</body>

</html>
