<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Agenda</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

<link rel="stylesheet" href="css/agenda.css">
<link rel="stylesheet" href="css/agenda-modal.css">
<link rel="stylesheet" href="css/agenda-tema-claro.css">

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <!-- links das outras páginas: montados pelo js/menu.js -->

    <button onclick="fazerLogout()">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>

<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="card card-agenda">

        <h2 style="text-align:center">Agenda</h2>

        <div class="modos">

            <button
                type="button"
                id="btnModoExpedicao"
                class="modo-btn"
                onclick="definirModo('expedicao')"
            >
                🏭 Expedição
            </button>

            <button
                type="button"
                id="btnModoTransportador"
                class="modo-btn"
                onclick="definirModo('transportador')"
            >
                🚚 Transportador
            </button>

        </div>

        <p class="dica-modo" id="dicaModo"></p>

        <div class="barra-agenda">

            <button type="button" onclick="abrirModalAgenda()">
                + Novo agendamento
            </button>

            <button
                type="button"
                class="btn-secundario"
                onclick="abrirModalMotoristas()"
            >
                🚚 Transportadoras e motoristas
            </button>

            <!-- filtro de datas estilo Excel: lista com caixinhas -->
            <div class="filtro-datas">

                <button
                    type="button"
                    id="btnDatas"
                    class="btn-secundario"
                    onclick="alternarPainelDatas()"
                >
                    📅 Todas as datas ▾
                </button>

                <div class="painel-datas" id="painelDatas">

                    <div class="atalhos-datas">

                        <button
                            type="button"
                            class="btn-secundario"
                            onclick="selecionarProximosDias(0)"
                        >
                            Só hoje
                        </button>

                        <button
                            type="button"
                            class="btn-secundario"
                            onclick="selecionarProximosDias(7)"
                        >
                            Próximos 7 dias
                        </button>

                    </div>

                    <input
                        type="text"
                        id="buscaDatas"
                        placeholder="Buscar data..."
                        autocomplete="off"
                    >

                    <label class="data-opcao data-todas">
                        <input type="checkbox" id="marcarTodasDatas">
                        <span>(Selecionar tudo)</span>
                    </label>

                    <div class="lista-datas" id="listaDatasFiltro"></div>

                </div>

            </div>

            <select id="filtroTipo">
                <option value="">Todos os tipos</option>
            </select>

            <!-- filtro de status igual ao de datas: lista com caixinhas -->
            <div class="filtro-status">

                <button
                    type="button"
                    id="btnStatus"
                    class="btn-secundario"
                    onclick="alternarPainelStatus()"
                >
                    🏷️ Todos os status ▾
                </button>

                <div class="painel-status" id="painelStatus">

                    <label class="data-opcao data-todas">
                        <input type="checkbox" id="marcarTodosStatus">
                        <span>(Selecionar tudo)</span>
                    </label>

                    <div class="lista-datas" id="listaStatusFiltro"></div>

                </div>

            </div>

            <select id="ordemAgenda" title="Ordem dentro de cada data"></select>

            <button
                type="button"
                class="btn-secundario"
                onclick="recarregarAgenda(true)"
                title="Buscar de novo os agendamentos e motoristas"
            >
                ↻ Atualizar
            </button>

            <button
                type="button"
                class="btn-secundario"
                id="btnColunasPadrao"
                style="display:none"
                onclick="restaurarOrdemColunas()"
                title="Voltar as colunas para a ordem padrão"
            >
                ↺ Colunas padrão
            </button>

            <button
                type="button"
                class="btn-secundario"
                id="btnTema"
                onclick="alternarTema()"
                title="Trocar entre fundo escuro e fundo claro"
            >
                ☀️ Fundo claro
            </button>

        </div>

        <div class="chips" id="chipsTransportadora"></div>

        <p class="contagem-agenda" id="contagemAgenda"></p>

        <div id="listaAgenda"></div>

    </div>

</div>

<!-- =========================
MODAL (novo / editar)
========================= -->

<div
    id="modalAgenda"
    class="modal-overlay"
    onclick="if(event.target === this) fecharModalAgenda()"
>

    <div class="modal-agenda">

        <div class="modal-agenda-topo">

            <div class="modal-titulo">

                <h3 id="tituloModalAgenda">Novo agendamento</h3>

                <span class="aviso-rascunho" id="avisoRascunho" style="display:none"></span>

            </div>

            <div class="modal-acoes">

                <button type="button" id="btnSalvarAgenda" onclick="salvarAgendamento()">
                    💾 Salvar
                </button>

                <button
                    type="button"
                    id="btnDescartarAgenda"
                    class="btn-secundario"
                    onclick="descartarRascunho()"
                >
                    🗑️ Descartar rascunho
                </button>

                <button
                    type="button"
                    id="btnExcluirAgenda"
                    class="btn-perigo"
                    style="display:none"
                    onclick="excluirAgendamentoAberto()"
                >
                    🗑️ Excluir agendamento
                </button>

                <button
                    type="button"
                    class="btn-fechar"
                    onclick="fecharModalAgenda()"
                    title="Fechar (o que foi digitado fica guardado como rascunho)"
                >
                    ×
                </button>

            </div>

        </div>

        <div class="form-grade">

            <div>
                <label for="agData">Data</label>
                <input type="date" id="agData">
            </div>

            <div>
                <label for="agHorario">Horário</label>
                <input
                    type="text"
                    id="agHorario"
                    list="listaHorarios"
                    maxlength="9"
                    autocomplete="off"
                    placeholder="08:00, CONFIRMAR ou IMEDIATO"
                >
            </div>

            <div>
                <label for="agTipo">Tipo</label>
                <select id="agTipo"></select>
            </div>

            <div>
                <label for="agStatus">Status</label>
                <select id="agStatus"></select>
            </div>

            <div>
                <label for="agPlataforma" id="rotuloPlataforma">Plataforma</label>
                <input type="text" id="agPlataforma" autocomplete="off" placeholder="Ex: WAE16010">
            </div>

            <div>
                <label for="agTransportadora">Transportadora</label>
                <select id="agTransportadora"></select>
            </div>

            <div class="largo" id="blocoRecolha" style="display:none">
                <label for="agPlataformaRecolha">Máquina de recolha (volta com a troca)</label>
                <input type="text" id="agPlataformaRecolha" autocomplete="off" placeholder="Ex: WTE10014">
            </div>

            <div>
                <label for="agCliente">Cliente</label>
                <input type="text" id="agCliente" placeholder="Nome do cliente">
            </div>

            <div>
                <label for="agMotorista">Motorista</label>
                <select id="agMotorista"></select>
            </div>

            <div>
                <label for="agProposta">Nº da proposta</label>
                <input type="text" id="agProposta">
            </div>

            <div>
                <label for="agPeriodo">Período</label>
                <input
                    type="text"
                    id="agPeriodo"
                    list="listaPeriodos"
                    autocomplete="off"
                    placeholder="16 dias, 3 períodos ou Anual"
                >
            </div>

            <p class="largo subtitulo-form">
                📍 Retirada (vazio em entrega e troca = W Rental)
            </p>

            <div class="largo">
                <label for="agOrigemNome">Nome do local</label>
                <input type="text" id="agOrigemNome" placeholder="Ex: Obra A">
            </div>

            <div class="largo">
                <label for="agOrigemEndereco">Endereço completo</label>
                <input type="text" id="agOrigemEndereco" placeholder="Ex: Rua A, 100, Fazenda, Itajaí/SC">
            </div>

            <div class="largo">
                <label for="agLinkOrigem">Link (opcional)</label>
                <input type="text" id="agLinkOrigem" placeholder="https://maps...">
            </div>

            <p class="largo subtitulo-form">
                📍 Entrega (vazio em coleta = W Rental)
            </p>

            <div class="largo">
                <label for="agDestinoNome">Nome do local</label>
                <input type="text" id="agDestinoNome" placeholder="Ex: Cliente X">
            </div>

            <div class="largo">
                <label for="agDestinoEndereco">Endereço completo</label>
                <input type="text" id="agDestinoEndereco" placeholder="Ex: Rua B, 200, Centro, Brusque/SC">
            </div>

            <div class="largo">
                <label for="agLinkDestino">Link (opcional)</label>
                <input type="text" id="agLinkDestino" placeholder="https://maps...">
            </div>

            <div>
                <label for="agFrete">Frete (R$)</label>
                <input type="text" id="agFrete" placeholder="Ex: 450,00">
            </div>

            <div>
                <label for="agFreteConta">Frete por conta de</label>
                <select id="agFreteConta">
                    <option value="nossa">Nossa conta</option>
                    <option value="cliente">Conta do cliente</option>
                </select>
            </div>

            <div class="largo">
                <label for="agObsExpedicao">Obs. para a expedição</label>
                <input type="text" id="agObsExpedicao">
            </div>

            <div class="largo">
                <label for="agObsEntrega">Obs. para a entrega (transportador)</label>
                <input type="text" id="agObsEntrega">
            </div>

            <p class="largo subtitulo-form">
                💬 Mensagem do Zap
            </p>

            <div class="largo">
                <label for="agReferencia">Referência (ficha / proposta — digitada à mão)</label>
                <input type="text" id="agReferencia" placeholder="Ficha / referência">
            </div>

            <div class="largo">
                <label for="agContato">Contato de quem vai receber</label>
                <input type="text" id="agContato" placeholder="Nome e telefone">
            </div>

            <div class="largo" id="blocoCard">
                <label for="agCard">Card</label>
                <input type="text" id="agCard">
            </div>

            <div class="largo" id="blocoEmails">
                <label for="agEmails">E-mails do cliente (financeiro)</label>
                <input type="text" id="agEmails" placeholder="a@cliente.com; b@cliente.com">
            </div>

        </div>

    </div>

</div>

<datalist id="listaHorarios">
    <option value="CONFIRMAR">
    <option value="IMEDIATO">
</datalist>

<datalist id="listaPeriodos"></datalist>

<!-- =========================
MODAL (cadastro de transportadoras e motoristas)
========================= -->

<div
    id="modalMotoristas"
    class="modal-overlay"
    onclick="if(event.target === this) fecharModalMotoristas()"
>

    <div class="modal-agenda modal-motoristas">

        <div class="modal-agenda-topo">

            <h3>🚚 Transportadoras e motoristas</h3>

            <button
                type="button"
                class="btn-fechar"
                onclick="fecharModalMotoristas()"
                title="Fechar"
            >
                ×
            </button>

        </div>

        <div class="modal-corpo">

            <p class="subtitulo-form" style="margin-top:0">Transportadoras</p>

            <div id="listaTransportadorasCadastro"></div>

            <div class="mot-novo">

                <input
                    type="text"
                    id="transNome"
                    placeholder="Nome da transportadora"
                >

                <button type="button" onclick="adicionarTransportadora()">
                    Adicionar
                </button>

            </div>

            <hr class="sep-modal">

            <p class="subtitulo-form" style="margin-top:0">Motoristas</p>

            <label class="rotulo-modal" for="motTransportadora">Transportadora</label>

            <select id="motTransportadora"></select>

            <div id="listaMotoristasCadastro"></div>

            <div class="mot-novo">

                <input
                    type="text"
                    id="motNome"
                    placeholder="Nome do motorista"
                >

                <button type="button" onclick="adicionarMotorista()">
                    Adicionar
                </button>

            </div>

        </div>

    </div>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-guard.js"></script>

<script src="js/helpers.js"></script>
<script src="js/menu.js"></script>
<script src="js/agenda-config.js"></script>
<script src="js/agenda-utils.js"></script>
<script src="js/agenda-banco.js"></script>
<script src="js/agenda-filtros.js"></script>
<script src="js/agenda-filtro-datas.js"></script>
<script src="js/agenda-filtro-status.js"></script>
<script src="js/agenda-ordem.js"></script>
<script src="js/agenda-render.js"></script>
<script src="js/agenda-linhas.js"></script>
<script src="js/agenda-colunas.js"></script>
<script src="js/agenda-tema.js"></script>
<script src="js/agenda-zap.js"></script>
<script src="js/agenda-transportadoras.js"></script>
<script src="js/agenda-motoristas.js"></script>
<script src="js/agenda-form-campos.js"></script>
<script src="js/agenda-rascunho.js"></script>
<script src="js/agenda-modal.js"></script>
<script src="js/agenda-salvar.js"></script>
<script src="js/agenda-coleta.js"></script>
<script src="js/agenda-init.js"></script>

</body>

</html>
