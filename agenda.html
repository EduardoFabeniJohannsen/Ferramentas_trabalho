<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Agenda</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

<style>
/* ===== Agenda ===== */
/* o card se ajusta ao conteúdo (não estica em tela grande) */
.card-agenda{
    width:fit-content;
    min-width:min(100%, 900px);
    max-width:100%;
    text-align:left;
}
.barra-agenda{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}
.barra-agenda select{
    width:auto;
    margin:0;
    flex:1;
    min-width:140px;
}
.barra-agenda button{
    margin:0;
}
/* botão ⚙️ Filtros: painel com os filtros e as opções da tela */
.filtro-geral{
    position:relative;
}
.filtro-geral > button.filtrando{
    background:#2563eb;
}
.painel-filtros{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    z-index:60;
    box-sizing:border-box;
    width:400px;
    max-width:92vw;
    max-height:78vh;
    overflow-y:auto;
    padding:12px;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.painel-filtros.aberto{
    display:flex;
    flex-direction:column;
    gap:8px;
}
.painel-filtros-titulo{
    margin:0;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    color:#94a3b8;
}
.painel-filtros-titulo:not(:first-child){
    margin-top:8px;
    padding-top:12px;
    border-top:1px solid #334155;
}
.painel-filtros .chips{
    margin:0;
}
.painel-filtros .chip{
    padding:5px 10px;
    font-size:13px;
}
.painel-filtros select{
    flex:none;
    width:100%;
}
.painel-filtros > button,
.painel-filtros .filtro-datas > button,
.painel-filtros .filtro-status > button,
.painel-filtros .filtro-colunas > button,
.painel-filtros .filtro-botoes > button{
    width:100%;
    text-align:left;
}
.contagem-agenda button{
    margin:0 0 0 6px;
    padding:2px 8px;
    font-size:12px;
}
/* pesquisa: campo + botão × pra limpar */
.busca-agenda{
    display:flex;
    gap:4px;
    flex:2;
    min-width:240px;
}
.busca-agenda input{
    margin:0;
    flex:1;
}
.btn-secundario{
    background:#475569;
}
.btn-secundario:hover{
    background:#334155;
}
.btn-perigo{
    background:#dc2626;
}
.btn-perigo:hover{
    background:#b91c1c;
}
/* ===== Filtro de datas (estilo Excel) ===== */
.filtro-datas,
.filtro-status,
.filtro-colunas,
.filtro-botoes{
    position:relative;
}
.filtro-datas > button.filtrando,
.filtro-status > button.filtrando{
    background:#2563eb;
}
.painel-datas,
.painel-status,
.painel-colunas,
.painel-botoes{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    z-index:60;
    width:300px;
    max-width:90vw;
    padding:10px;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.painel-datas.aberto,
.painel-status.aberto,
.painel-colunas.aberto,
.painel-botoes.aberto{
    display:block;
}
.painel-status,
.painel-colunas,
.painel-botoes{
    width:250px;
}
.painel-colunas .lista-datas{
    max-height:min(70vh, 520px);
}
/* dentro do ⚙️ Filtros, as listas abrem no meio do painel, sem flutuar */
.painel-filtros .painel-datas,
.painel-filtros .painel-status,
.painel-filtros .painel-colunas,
.painel-filtros .painel-botoes{
    position:static;
    width:auto;
    max-width:none;
    margin-top:6px;
    box-shadow:none;
}
.contagem-status{
    margin-left:auto;
    font-size:12px;
    color:#94a3b8;
}
.atalhos-datas{
    display:flex;
    gap:6px;
    margin-bottom:8px;
}
.atalhos-datas button{
    margin:0;
    padding:6px 10px;
    font-size:12px;
}
.painel-datas input[type="text"]{
    margin:0 0 8px;
    padding:6px 8px;
    font-size:13px;
}
.data-opcao{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 6px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
}
.data-opcao:hover{
    background:#334155;
}
.data-opcao input{
    width:auto;
    margin:0;
    padding:0;
}
.data-todas{
    font-weight:bold;
    border-bottom:1px solid #334155;
    border-radius:6px 6px 0 0;
}
.lista-datas{
    max-height:260px;
    overflow-y:auto;
    padding-top:4px;
}

.chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
}
.chip{
    margin:0;
    padding:8px 14px;
    background:#334155;
}
.chip:hover{
    background:#475569;
}
.chip.ativo{
    background:#2563eb;
}
.contagem-agenda{
    color:#94a3b8;
    font-size:13px;
    margin:0 0 8px;
}
.agenda-vazia{
    color:#94a3b8;
    text-align:center;
    padding:24px 0;
}

.modos{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:10px;
}
.modo-btn{
    margin:0;
    padding:10px 22px;
    background:#334155;
}
.modo-btn:hover{
    background:#475569;
}
.modo-btn.ativo{
    background:#2563eb;
}
.dica-modo{
    margin:0 0 10px;
    font-size:12px;
    color:#94a3b8;
    text-align:center;
}

/* ===== Lista (tabela: as colunas se ajustam ao texto e ficam alinhadas) ===== */
#listaAgenda{
    overflow-x:auto;
}
.ag-tabela{
    border-collapse:separate;
    border-spacing:0 3px;
    width:auto;
    max-width:100%;
}
.ag-tabela p{
    margin:0;
}
.ag-tabela thead th{
    padding:4px 10px;
    font-size:11px;
    font-weight:bold;
    text-align:left;
    text-transform:uppercase;
    color:#94a3b8;
    border-bottom:1px solid #334155;
    white-space:nowrap;
}
.ag-tabela thead th + th{
    border-left:1px dashed #475569;
}
.ag-tabela thead th.ag-cab-horario{
    text-align:center;
}
/* título arrastável (muda a ordem das colunas) */
.ag-tabela thead th.ag-cab-coluna{
    cursor:grab;
    user-select:none;
}
.ag-tabela thead th.ag-cab-coluna:hover{
    color:#e5e7eb;
}
.ag-tabela thead th.arrastando{
    opacity:.4;
}
.ag-tabela thead th.solta-antes{
    box-shadow:inset 3px 0 0 #3b82f6;
}
.ag-tabela thead th.solta-depois{
    box-shadow:inset -3px 0 0 #3b82f6;
}
.ag-tabela thead th.ag-cab-proposta{
    text-align:center;
}
.ag-tabela thead th.ag-cab-lado{
    border:none;
}
/* traço de corte do print: a proposta fica fora enquanto for a última coluna;
   se o usuário mudar ela de lugar, só os botões ficam fora */
.ag-tabela thead th.ag-cab-proposta:nth-last-child(2),
.ag-tabela thead th:not(.ag-cab-proposta) + th.ag-cab-lado{
    border-left:2px dashed #334155;
}

/* cabeçalho de cada dia (a cor do dia vem da variável --cor-dia) */
tr.ag-dia{
    --cor-dia:#94a3b8;
}
tr.ag-dia th{
    padding:3px 12px;
    font-size:14px;
    text-align:left;
    text-transform:capitalize;
    background:var(--cor-dia);
    color:#0f172a;
    border-radius:6px;
    background-clip:padding-box;
}
tr.ag-dia:not(:first-child) th{
    border-top:8px solid transparent;
}

/* linha de cada agendamento */
tr.ag-item{
    --cor-dia:#94a3b8;
}
tr.ag-item td{
    padding:2px 10px;
    font-size:13px;
    line-height:1.25;
    vertical-align:middle;
    background:#0f172a;
    background:color-mix(in srgb, var(--cor-dia) 16%, #0f172a);
    border-top:1px solid var(--cor-dia);
    border-bottom:1px solid var(--cor-dia);
}
tr.ag-item td + td{
    border-left:1px dashed #475569;
}
tr.ag-item td:first-child{
    border-left:6px solid var(--cor-dia);
    border-radius:8px 0 0 8px;
}
tr.ag-item td:last-child{
    border-right:1px solid var(--cor-dia);
    border-radius:0 8px 8px 0;
}
tr.ag-item[data-status="Cancelado"] td,
tr.ag-item[data-status="Concluído"] td{
    opacity:.55;
}
.ag-conteudo{
    overflow-wrap:anywhere;
}
/* colunas curtas (período, status, motorista...): nunca quebram de linha */
.ag-sem-quebra{
    white-space:nowrap;
}
.ag-hora{
    font-weight:bold;
    font-size:14px;
    text-align:center;
    white-space:nowrap;
}
.ag-hora.ag-hora-texto{
    font-size:11px;
}
/* horário em destaque: branco no fundo vermelho */
.ag-hora-pilula{
    display:inline-block;
    padding:1px 10px;
    border-radius:999px;
    background:#991b1b;
    color:#ffffff;
}
/* sem horário: discreto */
.ag-hora-vazio{
    color:#94a3b8;
    font-weight:normal;
}
.ag-patrimonio{
    font-weight:bold;
    font-size:15px;
}

/* status: a própria etiqueta troca o status ao clicar */
tr.ag-item select.tag-select{
    -webkit-appearance:none;
    appearance:none;
    width:auto;
    margin:0;
    padding:1px 9px;
    border:none;
    border-radius:999px;
    font-family:inherit;
    font-size:11px;
    font-weight:bold;
    color:#e5e7eb;
    text-align:center;
    cursor:pointer;
}
tr.ag-item select.tag-select option{
    background:#0f172a;
    color:#e5e7eb;
}
.tag{
    display:inline-block;
    padding:1px 8px;
    border-radius:999px;
    background:#334155;
    color:#e5e7eb;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}
.tag[data-tipo="Entrega"]{
    background:#1d4ed8;
}
.tag[data-tipo="Coleta"]{
    background:#b45309;
}
.tag[data-tipo="Transferência"]{
    background:#7e22ce;
}
.tag[data-tipo="Troca técnica"]{
    background:#0f766e;
}
/* transportadora "A definir": discreto, só o texto (sem etiqueta colorida) */
.tag.sem-transp{
    padding:0;
    background:transparent;
    color:#94a3b8;
    font-weight:normal;
}
.tag[data-status="A confirmar"]{
    background:#a16207;
}
.tag[data-status="Confirmado"]{
    background:#1d4ed8;
}
.tag[data-status="Em rota"]{
    background:#c2410c;
}
.tag[data-status="Concluído"]{
    background:#15803d;
}
.tag[data-status="Cancelado"]{
    background:#475569;
}

.ag-local{
    display:flex;
    flex-direction:column;
    gap:1px;
}
.ag-local-texto{
    font-weight:bold;
    color:#e5e7eb;
}
.ag-local-endereco{
    color:#cbd5e1;
}
.ag-link{
    display:block;
    font-size:11px;
    color:#60a5fa;
    word-break:break-all;
}
.ag-extra{
    color:#cbd5e1;
}

/* proposta e botões da linha: o traço de corte separa o que fica fora
   da área do print (ver o cabeçalho) */
tr.ag-item td.ag-proposta{
    padding-left:14px;
    padding-right:14px;
    font-size:12px;
    color:#cbd5e1;
    text-align:center;
    white-space:nowrap;
}
tr.ag-item td.ag-lado{
    padding-left:14px;
    border-left:1px dashed #475569;
}
tr.ag-item td.ag-proposta:nth-last-child(2),
tr.ag-item td:not(.ag-proposta) + td.ag-lado{
    border-left:2px dashed #334155;
}
tr.ag-item td.ag-proposta:first-child{
    border-left:6px solid var(--cor-dia);
}
.ag-botoes{
    display:flex;
    gap:16px;
    align-items:center;
}
.ag-botoes button{
    margin:0;
    padding:5px 10px;
}
.ag-botoes .btn-zap{
    background:#16a34a;
}
.ag-botoes .btn-zap:hover{
    background:#15803d;
}
.ag-botoes .btn-faturamento{
    background:#0e7490;
}
.ag-botoes .btn-faturamento:hover{
    background:#155e75;
}
.ag-botoes .btn-coleta{
    background:#b45309;
}
.ag-botoes .btn-coleta:hover{
    background:#92400e;
}
.ag-botoes .btn-estoque{
    background:#6d28d9;
}
.ag-botoes .btn-estoque:hover{
    background:#5b21b6;
}
.ag-botoes .btn-excluir-ag{
    margin-left:12px;
}
.ag-botoes .btn-excluir-ag:first-child{
    margin-left:0;
}

/* ===== Modal ===== */
.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:1100;
    background:rgba(0,0,0,.6);
    align-items:center;
    justify-content:center;
    padding:16px;
}
.modal-overlay.aberto{
    display:flex;
}
.modal-agenda{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}
/* cabeçalho fixo: o Salvar acompanha quando o formulário rola */
.modal-agenda-topo{
    position:sticky;
    top:0;
    z-index:5;
    display:flex;
    flex-wrap:wrap;
    gap:8px 12px;
    align-items:center;
    justify-content:space-between;
    padding:12px 20px;
    background:#1e293b;
    border-bottom:1px solid #334155;
}
.modal-agenda-topo h3{
    margin:0;
}
.modal-titulo{
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
    align-items:baseline;
}
.aviso-rascunho{
    font-size:12px;
    color:#fbbf24;
}
.modal-acoes{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
}
.modal-acoes button{
    margin:0;
    padding:8px 14px;
}
.modal-agenda .btn-fechar{
    margin:0;
    padding:2px 10px;
    font-size:20px;
}
/* lixeira (só admin) */
.modal-lixeira{
    max-width:720px;
}
.item-lixeira{
    display:flex;
    flex-wrap:wrap;
    gap:8px 12px;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #334155;
}
.item-lixeira-info{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
}
.item-lixeira-info small{
    opacity:.7;
}
.item-lixeira-botoes{
    display:flex;
    gap:8px;
}
.item-lixeira-botoes button{
    margin:0;
    padding:6px 12px;
}
body.tema-claro .item-lixeira{
    border-bottom-color:var(--claro-linha);
}
/* consulta ao estoque (botão 🔍 da linha) */
.estoque-topo{
    display:flex;
    flex-wrap:wrap;
    gap:8px 12px;
    align-items:center;
    justify-content:space-between;
}
.estoque-topo button{
    margin:0;
    padding:6px 12px;
}
.estoque-filial{
    margin-top:16px;
    overflow-x:auto;
}
.estoque-filial h4{
    margin:0;
}
.estoque-filial small{
    opacity:.7;
}
.estoque-nada{
    margin:8px 0 0;
    font-size:13px;
    opacity:.8;
}
.estoque-tabela{
    width:100%;
    margin-top:6px;
    border-collapse:collapse;
    table-layout:fixed;
    font-size:13px;
}
/* mesmas colunas nas duas filiais; o aviso de reserva fica com o espaço maior */
.estoque-tabela th:last-child{
    width:40%;
}
.estoque-tabela th,
.estoque-tabela td{
    padding:5px 8px;
    text-align:left;
    border-bottom:1px solid #334155;
}
.estoque-tabela th{
    font-size:11px;
    text-transform:uppercase;
    opacity:.75;
}
.estoque-patrimonio{
    font-weight:bold;
    white-space:nowrap;
}
.estoque-reserva{
    font-size:12px;
    color:#fbbf24;
}
body.tema-claro .estoque-tabela th,
body.tema-claro .estoque-tabela td{
    border-bottom-color:var(--claro-linha);
}
body.tema-claro .estoque-reserva{
    color:#a14a09;
}
.modal-corpo{
    padding:14px 20px 20px;
}
.form-grade{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 10px;
    padding:14px 20px 20px;
}
.form-grade label{
    display:block;
    font-size:12px;
    color:#94a3b8;
    margin-bottom:2px;
}
.form-grade .largo{
    grid-column:1 / -1;
}
.subtitulo-form{
    margin:10px 0 4px;
    font-size:13px;
    font-weight:bold;
    color:#cbd5e1;
}

/* ===== Faturamento (pagamento e pedido de compra) ===== */
#blocoFaturamento label{
    margin-top:6px;
}
.prazo-linha{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
}
.prazo-linha input{
    width:90px;
    margin:0;
    text-align:center;
}
.prazo-linha button{
    margin:0;
    padding:4px 10px;
}
/* plataformas: uma linha por equipamento */
.ag-plataforma-linha{
    margin-bottom:6px;
}
.ag-plataforma-linha input{
    margin:0;
}
.ag-plataforma-linha button{
    flex:none;
    width:38px;
    margin:0;
    padding:8px 0;
    font-size:18px;
    line-height:1;
}
.prazo-rotulo{
    min-width:56px;
    font-size:13px;
    color:#cbd5e1;
}
.prazo-unidade{
    font-size:13px;
    color:#94a3b8;
}
.btn-add-prazo{
    margin:0 10px 8px 0;
    padding:6px 12px;
    font-size:13px;
}
.resumo-prazos{
    font-size:13px;
    font-weight:bold;
    color:#cbd5e1;
}
#agPedidoCompra:disabled{
    opacity:.6;
    cursor:not-allowed;
}
.doc-linha{
    display:flex;
    align-items:center;
    gap:10px;
    margin:6px 0;
    padding:6px 10px;
    background:#0f172a;
    border:1px solid #334155;
    border-radius:8px;
    font-size:13px;
}
.doc-linha .doc-nome{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.doc-linha button{
    margin:0;
    padding:4px 10px;
}
.aviso-pedido{
    margin:4px 0 0;
    font-size:12px;
    color:#fbbf24;
}

/* ===== Etapas do formulário (demanda → local → faturamento) ===== */
.etapa{
    grid-column:1 / -1;
    margin-top:14px;
    border:1px solid #334155;
    border-left-width:5px;
    border-radius:10px;
    overflow:hidden;
}
.etapa:first-child{
    margin-top:0;
}
.etapa-demanda{
    border-left-color:#3b82f6;
}
.etapa-local{
    border-left-color:#f59e0b;
}
.etapa-faturamento{
    border-left-color:#22c55e;
}
.etapa-titulo{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0;
    padding:8px 14px;
    font-size:14px;
    background:#0f172a;
    color:#e5e7eb;
}
.etapa-num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;
    height:22px;
    border-radius:50%;
    font-size:12px;
    color:#0f172a;
    background:#94a3b8;
}
.etapa-demanda .etapa-num{
    background:#3b82f6;
}
.etapa-local .etapa-num{
    background:#f59e0b;
}
.etapa-faturamento .etapa-num{
    background:#22c55e;
}
.etapa-grade{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 10px;
    padding:6px 14px 14px;
}

/* etapa recolhível: clicar no título esconde o conteúdo */
.etapa-titulo{
    cursor:pointer;
    user-select:none;
}
.etapa-titulo:hover{
    filter:brightness(1.2);
}
.etapa-seta{
    margin-left:auto;
    font-size:14px;
    transition:transform .15s;
}
.etapa.recolhida .etapa-seta{
    transform:rotate(-90deg);
}
.etapa.recolhida .etapa-grade{
    display:none;
}

/* retirada recolhida (entrega): só o título com "W Rental" */
.titulo-retirada{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
}
.titulo-retirada:hover{
    filter:brightness(1.2);
}
.retirada-resumo{
    font-weight:normal;
    color:#94a3b8;
}
.retirada-seta{
    margin-left:auto;
    transition:transform .15s;
}
.titulo-retirada.recolhida .retirada-seta{
    transform:rotate(-90deg);
}

/* ===== Largura das colunas (arrastar a borda do título) ===== */
.ag-tabela thead th{
    position:relative;
}
.ag-redimensiona{
    position:absolute;
    top:0;
    right:-3px;
    width:7px;
    height:100%;
    z-index:2;
    cursor:col-resize;
    user-select:none;
    touch-action:none;
}
.ag-redimensiona:hover,
.ag-redimensiona.ativo{
    background:#3b82f6;
}
/* com largura escolhida, o texto quebra de linha dentro da coluna */
.ag-tabela.largura-fixa{
    table-layout:fixed;
}
.ag-tabela.largura-fixa .ag-conteudo{
    max-width:none !important;
    overflow-wrap:anywhere;
}
.ag-tabela.largura-fixa .ag-sem-quebra{
    white-space:normal;
}
.ag-tabela.largura-fixa thead th{
    overflow:hidden;
    text-overflow:ellipsis;
}
.ag-tabela.largura-fixa thead th .ag-redimensiona{
    right:0;
}

/* ===== Patrimônio ainda não definido (só o modelo, ex: WAE15) ===== */
.ag-patr-incompleto{
    padding:0 6px;
    border-radius:6px;
    background:#facc15;
    color:#422006;
}
.ag-patr-aviso{
    margin-left:4px;
    padding:0 6px;
    border-radius:999px;
    background:#b45309;
    color:#ffffff;
    font-size:10px;
    font-weight:bold;
    white-space:nowrap;
    text-transform:uppercase;
}
.aviso-patrimonio{
    margin:3px 0 0;
    font-size:12px;
    color:#fbbf24;
}
#btnSemPatrimonio.filtrando{
    background:#b45309;
}

@media(max-width:600px){
    .form-grade,
    .etapa-grade{
        grid-template-columns:1fr;
    }
}

/* ===== Fundo claro (opção, escolhida no botão da barra) ===== */
/* tons pastéis: se quiser mais claro ou mais escuro, é só mexer nestas cores */

body.tema-claro .ag-local-texto{

}
body.tema-claro .ag-local-endereco,
body.tema-claro .ag-extra{

}
body.tema-claro .ag-link{
    color:#1d4ed8;
}
body.tema-claro .modal-agenda{

}
body.tema-claro .modal-agenda-topo{

}
body.tema-claro .form-grade label{

}
body.tema-claro .subtitulo-form{
    color:#2c3a52;
}
body.tema-claro .aviso-rascunho{

}
body.tema-claro .tag.sem-transp,
body.tema-claro .ag-hora-vazio{

}
body.tema-claro .contagem-status{
    color:#52617a;
}
body.tema-claro .painel-filtros-titulo{

}
body.tema-claro .painel-filtros-titulo:not(:first-child){

}
body.tema-claro .painel-filtros,
body.tema-claro .painel-datas,
body.tema-claro .painel-status,
body.tema-claro .painel-colunas,
body.tema-claro .painel-botoes{

}
body.tema-claro .data-opcao:hover{

}

}
body.tema-claro .ag-tabela thead th.ag-cab-coluna:hover{

}
body.tema-claro .prazo-rotulo,
body.tema-claro .resumo-prazos{

}

}

}

}

</style>

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <!-- links das outras páginas: montados pelo js/menu.js -->

    <button onclick="fazerLogout()">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>

<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="card card-agenda">

        <h2 style="text-align:center">Agenda</h2>

        <div class="modos">

            <button
                type="button"
                id="btnModoExpedicao"
                class="modo-btn"
                onclick="definirModo('expedicao')"
            >
                🏭 Expedição
            </button>

            <button
                type="button"
                id="btnModoTransportador"
                class="modo-btn"
                onclick="definirModo('transportador')"
            >
                🚚 Transportador
            </button>

        </div>

        <p class="dica-modo" id="dicaModo"></p>

        <div class="barra-agenda">

            <button type="button" onclick="abrirModalAgenda()">
                + Novo agendamento
            </button>

            <!-- pesquisa (agenda-busca.js): também acha os agendamentos antigos -->
            <div class="busca-agenda">

                <input
                    type="search"
                    id="buscaAgenda"
                    placeholder="🔍 Pesquisar: endereço, cliente ou patrimônio"
                    autocomplete="off"
                    title="Procura também nos agendamentos antigos. Pesquisando, os filtros de data e status ficam de lado."
                >

                <button
                    type="button"
                    class="btn-secundario"
                    id="btnLimparBusca"
                    style="display:none"
                    onclick="limparBuscaAgenda()"
                    title="Limpar a pesquisa"
                >
                    ×
                </button>

            </div>

            <!-- filtros e opções da tela: tudo num botão só (agenda-filtros.js) -->
            <div class="filtro-geral">

                <button
                    type="button"
                    id="btnFiltros"
                    class="btn-secundario"
                    onclick="alternarPainelFiltros()"
                    title="Filtrar os agendamentos e escolher o que aparece na tela"
                >
                    ⚙️ Filtros ▾
                </button>

                <div class="painel-filtros" id="painelFiltros">

                    <p class="painel-filtros-titulo">Filtrar agendamentos</p>

                    <div class="chips" id="chipsTransportadora"></div>

                    <!-- filtro de datas estilo Excel: lista com caixinhas -->
                    <div class="filtro-datas">

                        <button
                            type="button"
                            id="btnDatas"
                            class="btn-secundario"
                            onclick="alternarPainelDatas()"
                        >
                            📅 Todas as datas ▾
                        </button>

                        <div class="painel-datas" id="painelDatas">

                            <div class="atalhos-datas">

                                <button
                                    type="button"
                                    class="btn-secundario"
                                    onclick="selecionarProximosDias(0)"
                                >
                                    Só hoje
                                </button>

                                <button
                                    type="button"
                                    class="btn-secundario"
                                    onclick="selecionarProximosDias(7)"
                                >
                                    Próximos 7 dias
                                </button>

                            </div>

                            <input
                                type="text"
                                id="buscaDatas"
                                placeholder="Buscar data..."
                                autocomplete="off"
                            >

                            <label class="data-opcao data-todas">
                                <input type="checkbox" id="marcarTodasDatas">
                                <span>(Selecionar tudo)</span>
                            </label>

                            <div class="lista-datas" id="listaDatasFiltro"></div>

                        </div>

                    </div>

                    <select id="filtroTipo">
                        <option value="">Todos os tipos</option>
                    </select>

                    <!-- filtro de status igual ao de datas: lista com caixinhas -->
                    <div class="filtro-status">

                        <button
                            type="button"
                            id="btnStatus"
                            class="btn-secundario"
                            onclick="alternarPainelStatus()"
                        >
                            🏷️ Todos os status ▾
                        </button>

                        <div class="painel-status" id="painelStatus">

                            <label class="data-opcao data-todas">
                                <input type="checkbox" id="marcarTodosStatus">
                                <span>(Selecionar tudo)</span>
                            </label>

                            <div class="lista-datas" id="listaStatusFiltro"></div>

                        </div>

                    </div>

                    <!-- só as máquinas cujo patrimônio a manutenção ainda não definiu -->
                    <button
                        type="button"
                        class="btn-secundario"
                        id="btnSemPatrimonio"
                        onclick="alternarSemPatrimonio()"
                        title="Mostrar só as máquinas sem patrimônio definido (só o modelo, ex: WAE15)"
                    >
                        ⚠️ Só sem patrimônio
                    </button>

                    <p class="painel-filtros-titulo">O que aparece na tela</p>

                    <select id="ordemAgenda" title="Ordem dentro de cada data"></select>

                    <!-- só na expedição: escolher quais informações aparecem -->
                    <div class="filtro-colunas" id="filtroColunas" style="display:none">

                        <button
                            type="button"
                            id="btnColunas"
                            class="btn-secundario"
                            onclick="alternarPainelColunas()"
                            title="Escolher quais informações aparecem na tabela"
                        >
                            👁️ Colunas ▾
                        </button>

                        <div class="painel-colunas" id="painelColunas">

                            <div class="lista-datas" id="listaColunasVisiveis"></div>

                        </div>

                    </div>

                    <!-- cada usuário escolhe os botões que aparecem em cada agendamento -->
                    <div class="filtro-botoes">

                        <button
                            type="button"
                            id="btnBotoes"
                            class="btn-secundario"
                            onclick="alternarPainelBotoes()"
                            title="Escolher quais botões aparecem em cada agendamento"
                        >
                            🔘 Botões ▾
                        </button>

                        <div class="painel-botoes" id="painelBotoes">

                            <div class="lista-datas" id="listaBotoesLinha"></div>

                        </div>

                    </div>

                    <button
                        type="button"
                        class="btn-secundario"
                        id="btnColunasPadrao"
                        style="display:none"
                        onclick="restaurarColunasPadrao()"
                        title="Voltar as colunas para a ordem, a largura e as informações padrão"
                    >
                        ↺ Colunas padrão
                    </button>

                </div>

            </div>

            <button
                type="button"
                class="btn-secundario"
                onclick="recarregarAgenda(true)"
                title="Buscar de novo os agendamentos e motoristas"
            >
                ↻ Atualizar
            </button>

            <button
                type="button"
                class="btn-secundario"
                id="btnTema"
                onclick="alternarTema()"
                title="Trocar entre fundo escuro e fundo claro"
            >
                ☀️ Fundo claro
            </button>

            <!-- só admin: agendamentos excluídos (restaurar ou apagar de vez) -->
            <button
                type="button"
                class="btn-secundario so-admin"
                style="display:none"
                onclick="abrirLixeira()"
                title="Agendamentos excluídos: restaurar ou apagar de vez"
            >
                🗑️ Lixeira
            </button>

        </div>

        <p class="contagem-agenda">
            <span id="contagemAgenda"></span>
            <span id="resumoFiltros"></span>
            <button
                type="button"
                class="btn-secundario"
                id="btnLimparFiltros"
                style="display:none"
                onclick="limparFiltros()"
            >
                × Limpar filtros
            </button>
        </p>

        <div id="listaAgenda"></div>

    </div>

</div>

<!-- =========================
MODAL (novo / editar)
========================= -->

<!-- clicar fora NÃO fecha: só o × (que guarda o que foi digitado como rascunho) -->
<div
    id="modalAgenda"
    class="modal-overlay"
>

    <div class="modal-agenda">

        <div class="modal-agenda-topo">

            <div class="modal-titulo">

                <h3 id="tituloModalAgenda">Novo agendamento</h3>

                <span class="aviso-rascunho" id="avisoRascunho" style="display:none"></span>

            </div>

            <div class="modal-acoes">

                <button type="button" id="btnSalvarAgenda" onclick="salvarAgendamento()">
                    💾 Salvar
                </button>

                <button
                    type="button"
                    id="btnDescartarAgenda"
                    class="btn-secundario"
                    onclick="descartarRascunho()"
                >
                    🗑️ Descartar rascunho
                </button>

                <button
                    type="button"
                    id="btnExcluirAgenda"
                    class="btn-perigo"
                    style="display:none"
                    onclick="excluirAgendamentoAberto()"
                >
                    🗑️ Excluir agendamento
                </button>

                <button
                    type="button"
                    class="btn-fechar"
                    onclick="fecharModalAgenda()"
                    title="Fechar (o que foi digitado fica guardado como rascunho)"
                >
                    ×
                </button>

            </div>

        </div>

        <div class="form-grade">

            <!-- ETAPA 1: a demanda (o que, quando e quem) -->
            <section class="etapa etapa-demanda" data-etapa="demanda">

                <h4 class="etapa-titulo"><span class="etapa-num">1</span> Demanda</h4>

                <div class="etapa-grade">

                    <div>
                        <label for="agData">Data</label>
                        <input type="date" id="agData">
                    </div>

                    <div>
                        <label for="agHorario">Horário</label>
                        <input
                            type="text"
                            id="agHorario"
                            list="listaHorarios"
                            maxlength="9"
                            autocomplete="off"
                            placeholder="08:00, CONFIRMAR ou IMEDIATO"
                        >
                    </div>

                    <div>
                        <label for="agTipo">Tipo</label>
                        <select id="agTipo"></select>
                    </div>

                    <div>
                        <label for="agStatus">Status</label>
                        <select id="agStatus"></select>
                    </div>

                    <!-- uma linha por equipamento (quantidade, − e +); o que é
                         salvo é o campo escondido, ex: "2x WAD16 + WTE12" -->
                    <div class="largo">
                        <label id="rotuloPlataforma">Plataforma</label>
                        <div id="listaPlataformas"></div>
                        <input type="hidden" id="agPlataforma">
                        <p class="aviso-patrimonio" id="avisoPatrimonio" style="display:none"></p>
                    </div>

                    <div class="largo" id="blocoRecolha" style="display:none">
                        <label for="agPlataformaRecolha">Máquina de recolha (volta com a troca)</label>
                        <input type="text" id="agPlataformaRecolha" autocomplete="off" placeholder="Ex: WTE10014">
                        <p class="aviso-patrimonio" id="avisoPatrimonioRecolha" style="display:none"></p>
                    </div>

                    <div>
                        <label for="agTransportadora">Transportadora</label>
                        <select id="agTransportadora"></select>
                    </div>

                    <div>
                        <label for="agCliente">Cliente</label>
                        <input type="text" id="agCliente" placeholder="Nome do cliente">
                    </div>

                    <div>
                        <label for="agMotorista">Motorista</label>
                        <select id="agMotorista"></select>
                    </div>

                    <div>
                        <label for="agProposta">Nº da proposta</label>
                        <input type="text" id="agProposta">
                    </div>

                    <div>
                        <label for="agPeriodo">Período</label>
                        <input
                            type="text"
                            id="agPeriodo"
                            list="listaPeriodos"
                            autocomplete="off"
                            placeholder="16 dias, 3 períodos ou Anual"
                        >
                    </div>

                    <div class="largo">
                        <label for="agReferencia">Referência da mensagem do Zap (ficha / proposta — digitada à mão)</label>
                        <input type="text" id="agReferencia" placeholder="Ficha / referência">
                    </div>

                </div>

            </section>

            <!-- ETAPA 2: o local certo (retirada, entrega, frete e observações) -->
            <section class="etapa etapa-local" data-etapa="local">

                <h4 class="etapa-titulo"><span class="etapa-num">2</span> Local e entrega</h4>

                <div class="etapa-grade">

                    <!-- em entrega vem recolhida (quase sempre é a W Rental); clique abre -->
                    <p
                        class="largo subtitulo-form titulo-retirada"
                        id="tituloRetirada"
                        tabindex="0"
                        role="button"
                        title="Clique para mostrar ou esconder o local de retirada"
                    >
                        📍 Retirada (vazio em entrega e troca = W Rental)
                        <span class="retirada-resumo" id="resumoRetirada"></span>
                        <span class="retirada-seta">▾</span>
                    </p>

                    <div class="largo campo-retirada">
                        <label for="agOrigemNome">Nome do local</label>
                        <input type="text" id="agOrigemNome" placeholder="Ex: Obra A">
                    </div>

                    <div class="largo campo-retirada">
                        <label for="agOrigemEndereco">Endereço completo</label>
                        <input type="text" id="agOrigemEndereco" placeholder="Ex: Rua A, 100, Fazenda, Itajaí/SC">
                    </div>

                    <div class="largo campo-retirada">
                        <label for="agLinkOrigem">Link (opcional)</label>
                        <input type="text" id="agLinkOrigem" placeholder="https://maps...">
                    </div>

                    <p class="largo subtitulo-form">
                        📍 Entrega (vazio em coleta = W Rental)
                    </p>

                    <div class="largo">
                        <label for="agDestinoNome">Nome do local</label>
                        <input type="text" id="agDestinoNome" placeholder="Ex: Cliente X">
                    </div>

                    <div class="largo">
                        <label for="agDestinoEndereco">Endereço completo</label>
                        <input type="text" id="agDestinoEndereco" placeholder="Ex: Rua B, 200, Centro, Brusque/SC">
                    </div>

                    <div class="largo">
                        <label for="agLinkDestino">Link (opcional)</label>
                        <input type="text" id="agLinkDestino" placeholder="https://maps...">
                    </div>

                    <div>
                        <label for="agFrete">Frete (R$)</label>
                        <input type="text" id="agFrete" placeholder="Ex: 450,00">
                    </div>

                    <div>
                        <label for="agFreteConta">Frete por conta de</label>
                        <select id="agFreteConta">
                            <option value="nossa">Nossa conta</option>
                            <option value="cliente">Conta do cliente</option>
                        </select>
                    </div>

                    <div class="largo" id="blocoCard">
                        <label for="agCard">Card</label>
                        <input type="text" id="agCard">
                    </div>

                    <div class="largo" id="blocoEmails">
                        <label for="agEmails">E-mails do cliente (faturamento)</label>
                        <input type="text" id="agEmails" placeholder="a@cliente.com; b@cliente.com">
                    </div>

                    <div class="largo">
                        <label for="agContato">Contato de quem vai receber</label>
                        <input type="text" id="agContato" placeholder="Nome e telefone">
                    </div>

                    <div class="largo">
                        <label for="agObsExpedicao">Obs. para a expedição</label>
                        <input type="text" id="agObsExpedicao">
                    </div>

                    <div class="largo">
                        <label for="agObsEntrega">Obs. para a entrega (transportador)</label>
                        <input type="text" id="agObsEntrega">
                    </div>

                </div>

            </section>

            <!-- ETAPA 3: particularidades de faturamento -->
            <!-- só aparece nas entregas (agenda-pagamento.js) -->
            <section class="etapa etapa-faturamento" data-etapa="faturamento" style="display:none">

                <h4 class="etapa-titulo"><span class="etapa-num">3</span> Faturamento</h4>

                <div class="etapa-grade">

                    <!-- faturamento: só aparece nas entregas -->
            <div class="largo" id="blocoFaturamento">

                <p class="subtitulo-form">
                    💳 Faturamento (pagamento e pedido de compra)
                </p>

                <label for="agFormaPagamento">Forma de pagamento</label>
                <select id="agFormaPagamento">
                    <option value="">Não informada</option>
                    <option value="Depósito">Depósito</option>
                    <option value="Boleto">Boleto</option>
                </select>

                <label>Prazo de pagamento (uma linha por vencimento)</label>
                <div id="listaPrazos"></div>
                <button type="button" class="btn-secundario btn-add-prazo" id="btnAddPrazo">
                    + Adicionar prazo
                </button>
                <span class="resumo-prazos" id="resumoPrazos"></span>

                <label for="agPedidoCompra">Pedido de compra</label>
                <select id="agPedidoCompra">
                    <option value="nao">Não</option>
                    <option value="sim">Sim</option>
                </select>

                <div id="blocoPedido" style="display:none">

                    <label for="agPedidoNumero">Número do pedido de compra</label>
                    <input type="text" id="agPedidoNumero" maxlength="40" autocomplete="off">

                    <div class="doc-linha" id="linhaPedidoPdf" style="display:none">
                        <span class="doc-nome" id="nomePedidoPdf"></span>
                        <button type="button" class="btn-secundario" id="btnAbrirPedidoPdf" title="Abrir o PDF">👁 Abrir</button>
                        <button type="button" class="btn-secundario" id="btnApagarPedidoPdf" title="Apagar o PDF">🗑️ Apagar</button>
                    </div>

                    <div id="campoPedidoPdf">
                        <label for="arquivoPedidoPdf">PDF do pedido (até 5 MB)</label>
                        <input type="file" id="arquivoPedidoPdf" accept="application/pdf,.pdf">
                    </div>

                    <p class="aviso-pedido" id="avisoPedidoPdf"></p>

                </div>

            </div>

                </div>

            </section>

        </div>

    </div>

</div>

LIXEIRA (só admin)
