<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Estoque</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

<link rel="stylesheet" href="css/estoque.css">

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <button onclick="fazerLogout()">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>


<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="estoque-pagina">

        <div class="card card-estoque-topo">

            <div class="estoque-topo-linha">

                <h2 id="tituloEstoque">Estoque de plataformas</h2>

                <div class="troca-filial">

                    <button
                        type="button"
                        class="btn-filial ativo"
                        data-filial="ITAJAI"
                        onclick="trocarFilial('ITAJAI')"
                    >
                        Itajaí
                    </button>

                    <button
                        type="button"
                        class="btn-filial"
                        data-filial="JOINVILLE"
                        onclick="trocarFilial('JOINVILLE')"
                    >
                        Joinville
                    </button>

                </div>

            </div>

            <p class="estoque-atualizado" id="estoqueAtualizado">
                Carregando...
            </p>

            <div class="barra-upload">

                <button type="button" id="btnEnviarEstoque">
                    📤 Enviar planilha do estoque
                </button>

                <input
                    type="file"
                    id="arquivoEstoque"
                    accept=".xlsx,.xls"
                    class="oculto"
                >

                <span class="dica">
                    Suba o Excel bruto do estoque. Você confere a prévia antes de publicar.
                </span>

            </div>

            <p class="avisos-estoque oculto" id="avisosEstoque"></p>

        </div>

        <div class="faixa-previa oculto" id="faixaPrevia">

            <span id="textoPrevia"></span>

            <button
                type="button"
                class="btn-publicar"
                id="btnPublicar"
                onclick="publicarResumo()"
            >
                ✅ Publicar
            </button>

            <button
                type="button"
                class="btn-cancelar"
                onclick="cancelarPrevia()"
            >
                Cancelar
            </button>

        </div>

        <div class="grade-estoque" id="resumoEstoque"></div>

    </div>

</div>


<div id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-guard.js"></script>

<script src="js/helpers.js"></script>
<script src="js/menu.js"></script>
<script src="js/estoque-config.js"></script>
<script src="js/estoque-parser.js"></script>
<script src="js/estoque-grupos.js"></script>
<script src="js/estoque-render.js"></script>
<script src="js/estoque-dados.js"></script>
<script src="js/estoque-upload.js"></script>
<script src="js/estoque-init.js"></script>

</body>

</html>
