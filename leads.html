<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Leads</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

<link rel="stylesheet" href="css/leads.css">

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <!-- links das outras páginas: montados pelo js/menu.js -->

    <button onclick="fazerLogout()">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>


<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="card card-leads">

        <h2>Leads</h2>

        <div class="contadores-leads">

            <div class="contador-lead">
                <strong id="contadorNovos">0</strong>
                Novos
            </div>

            <div class="contador-lead">
                <strong id="contadorHoje">0</strong>
                Chamados hoje
            </div>

            <div class="contador-lead">
                <strong id="contadorInteressados">0</strong>
                Interessados
            </div>

        </div>

        <p class="ultima-busca" id="ultimaBusca" style="display:none"></p>

        <div class="barra-leads">

            <input
                type="search"
                id="buscaLeads"
                placeholder="🔍 Buscar empresa"
                autocomplete="off"
            >

            <select id="filtroCidade" title="Cidade"></select>

            <select id="filtroSegmento" title="Segmento"></select>

            <select id="filtroPorte" title="Porte"></select>

            <select id="filtroStatus" title="Status"></select>

            <button type="button" class="btn-secundario" onclick="recarregarLeads(true)">
                ↻ Atualizar
            </button>

            <button type="button" class="btn-secundario" onclick="abrirConfigBusca()">
                ⚙️ Configuração de busca
            </button>

        </div>

        <div class="vendedor-leads">

            <label for="nomeVendedor">Seu nome nas mensagens:</label>

            <input type="text" id="nomeVendedor" autocomplete="off">

        </div>

        <!-- quem já está sendo chamado: aparece junto com os novos -->
        <div id="secaoAndamento" style="display:none">

            <h3 class="titulo-secao-lead" id="tituloAndamento"></h3>

            <div class="lista-leads" id="listaAndamento"></div>

            <h3 class="titulo-secao-lead">Novos</h3>

        </div>

        <p class="contagem-leads" id="contagemLeads"></p>

        <div class="lista-leads" id="listaLeads"></div>

        <p class="leads-vazio" id="leadsVazio" style="display:none"></p>

    </div>

</div>


<!-- =========================
MODAL (configuração de busca)
========================= -->

<div id="modalConfigBusca" class="modal-overlay">

    <div class="modal-config-leads">

        <div class="modal-config-topo">

            <h3>⚙️ Configuração de busca</h3>

            <button type="button" onclick="fecharConfigBusca()" title="Fechar">×</button>

        </div>

        <p class="dica-leads">
            O agente externo lê as configurações ativas para encontrar novas empresas.
        </p>

        <div id="listaConfigBusca"></div>

        <div class="form-config-leads">

            <h4 id="tituloFormConfig">Nova configuração</h4>

            <label for="configNome">Nome</label>
            <input type="text" id="configNome" placeholder="Ex: Construtoras do Vale" autocomplete="off">

            <label for="configCidades">Cidades (separadas por vírgula)</label>
            <input type="text" id="configCidades" placeholder="Ex: Itajaí, Brusque, Joinville" autocomplete="off">

            <label for="configUf">UF</label>
            <input type="text" id="configUf" placeholder="Ex: SC" maxlength="2" autocomplete="off">

            <label for="configSegmentos">Segmentos (separados por vírgula)</label>
            <input type="text" id="configSegmentos" placeholder="Ex: Construção civil, Indústria" autocomplete="off">

            <label>Portes</label>
            <div class="portes-config" id="configPortes"></div>

            <label for="configPalavras">Palavras-chave</label>
            <input type="text" id="configPalavras" placeholder="Ex: obra nova, ampliação, galpão" autocomplete="off">

            <div class="botoes-config-leads">

                <button type="button" onclick="salvarConfigBusca()">Salvar</button>

                <button type="button" class="btn-secundario" onclick="limparFormConfig()">Limpar</button>

            </div>

        </div>

    </div>

</div>


<div id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-guard.js"></script>

<script src="js/helpers.js"></script>
<script src="js/atualizacao-sistema.js"></script>
<script src="js/presenca.js"></script>
<script src="js/menu.js"></script>
<script src="js/leads/leads-config.js"></script>
<script src="js/leads/leads-contato.js"></script>
<script src="js/leads/leads-utils.js"></script>
<script src="js/leads/leads-dados.js"></script>
<script src="js/leads/leads-filtros.js"></script>
<script src="js/leads/leads-lista.js"></script>
<script src="js/leads/leads-cards.js"></script>
<script src="js/leads/leads-acoes.js"></script>
<script src="js/leads/leads-busca-config.js"></script>
<script src="js/leads/leads-init.js"></script>

</body>

</html>
