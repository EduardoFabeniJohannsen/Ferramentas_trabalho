<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Leads</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

<style>
.card-leads{
    width:100%;
    max-width:1200px;
    text-align:left;
}
.btn-secundario{
    background:#475569;
}
.btn-secundario:hover{
    background:#334155;
}

/* ===== Contadores ===== */
.contadores-leads{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
}
.contador-lead{
    flex:1;
    min-width:130px;
    padding:8px 12px;
    border:1px solid #334155;
    border-radius:8px;
    background:#0f172a;
    font-size:13px;
    color:#94a3b8;
}
.contador-lead strong{
    display:block;
    font-size:22px;
    color:#e5e7eb;
}

/* resultado da busca automática */
.ultima-busca{
    margin:0 0 12px;
    font-size:13px;
    color:#94a3b8;
}
.ultima-busca.atrasada{
    padding:6px 10px;
    border-radius:6px;
    background:#b91c1c;
    color:#ffffff;
    font-weight:bold;
}

/* ===== Barra e filtros ===== */
.barra-leads{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:12px;
}
.barra-leads input,
.barra-leads select{
    width:auto;
    flex:1;
    min-width:140px;
    margin:0;
    font-size:14px;
}
.barra-leads #buscaLeads{
    flex:2;
    min-width:220px;
}
.barra-leads button{
    margin:0;
}
.vendedor-leads{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    font-size:13px;
    color:#94a3b8;
}
.vendedor-leads input{
    width:220px;
    max-width:100%;
    margin:0;
    padding:6px 10px;
    font-size:14px;
}
.titulo-secao-lead{
    margin:16px 0 8px;
    font-size:15px;
}
.contagem-leads{
    margin:0 0 8px;
    font-size:13px;
    color:#94a3b8;
}
.leads-vazio{
    padding:24px 8px;
    text-align:center;
    color:#94a3b8;
}

/* ===== Cards dos leads ===== */
.lista-leads{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));
    gap:10px;
}
.lead{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
    padding:12px;
    border:1px solid #334155;
    border-radius:10px;
    background:#0f172a;
    font-size:14px;
}
.lead.com-outro{
    border-color:#b45309;
}
.lead.comigo{
    border-color:#3b82f6;
}
.lead-topo{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
}
.lead-empresa{
    font-size:16px;
    font-weight:bold;
    overflow-wrap:anywhere;
}
.tag-lead{
    flex:none;
    padding:2px 9px;
    border-radius:999px;
    font-size:11px;
    font-weight:bold;
    color:#ffffff;
    background:#475569;
}
.tag-lead[data-status="novo"]{
    background:#2563eb;
}
.tag-lead[data-status="chamado"]{
    background:#b45309;
}
.tag-lead[data-status="interessado"]{
    background:#15803d;
}
.tag-lead[data-status="ja_cliente"]{
    background:#7c3aed;
}
.lead-dados,
.lead-contato{
    color:#94a3b8;
    font-size:13px;
    overflow-wrap:anywhere;
}
.lead-contato a{
    color:#60a5fa;
}
.lead-motivo{
    overflow-wrap:anywhere;
}
.lead-chamado{
    padding:4px 8px;
    border-radius:6px;
    background:rgba(251,191,36,.15);
    color:#fbbf24;
    font-size:13px;
    font-weight:bold;
}
.lead.comigo .lead-chamado{
    background:rgba(96,165,250,.15);
    color:#93c5fd;
}
.lead-acoes{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}
.lead-acoes button,
.lead-acoes a{
    margin:0;
    padding:6px 10px;
    border-radius:8px;
    background:#475569;
    color:#ffffff;
    font-size:13px;
    font-weight:bold;
    text-decoration:none;
}
.lead-acoes button:hover,
.lead-acoes a:hover{
    background:#334155;
}
.lead-acoes .btn-pegar{
    background:#2563eb;
}
.lead-acoes .btn-pegar:hover{
    background:#1d4ed8;
}
.lead-acoes .btn-whatsapp{
    background:#16a34a;
}
.lead-acoes .btn-whatsapp:hover{
    background:#15803d;
}
.lead-acoes .btn-interessado{
    background:#15803d;
}
.lead-acoes .btn-sem-interesse{
    background:#b91c1c;
}
.lead-obs{
    display:flex;
    align-items:center;
    gap:6px;
}
.lead-obs input{
    flex:1;
    min-width:0;
    margin:0;
    padding:6px 8px;
    font-size:13px;
}
.lead-obs small{
    flex:none;
    color:#4ade80;
}

/* ===== Configuração de busca ===== */
.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:1100;
    background:rgba(0,0,0,.6);
    align-items:center;
    justify-content:center;
    padding:16px;
}
.modal-overlay.aberto{
    display:flex;
}
.modal-config-leads{
    box-sizing:border-box;
    width:100%;
    max-width:680px;
    max-height:90vh;
    overflow:auto;
    padding:16px 20px 20px;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.modal-config-topo{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
}
.modal-config-topo h3{
    margin:0;
}
.modal-config-topo button{
    margin:0;
    padding:2px 10px;
    font-size:20px;
}
.dica-leads{
    margin:0 0 10px;
    font-size:13px;
    color:#94a3b8;
}
.config-busca{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid #334155;
    font-size:14px;
}
.config-busca.inativa .config-busca-info{
    opacity:.55;
}
.config-busca-info{
    flex:1;
    min-width:220px;
    overflow-wrap:anywhere;
}
.config-busca-info small{
    display:block;
    color:#94a3b8;
}
.config-busca-botoes{
    display:flex;
    gap:6px;
}
.config-busca-botoes button{
    margin:0;
    padding:5px 10px;
    font-size:13px;
}
.form-config-leads{
    margin-top:14px;
}
.form-config-leads h4{
    margin:0 0 8px;
}
.form-config-leads label{
    display:block;
    margin-bottom:3px;
    font-size:13px;
    color:#cbd5e1;
}
.portes-config{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:8px;
}
.portes-config label{
    display:flex;
    align-items:center;
    gap:5px;
    margin:0;
    font-size:14px;
}
.portes-config input{
    width:auto;
    margin:0;
}
.botoes-config-leads{
    display:flex;
    gap:8px;
}
</style>

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <!-- links das outras páginas: montados pelo js/menu.js -->

    <button onclick="fazerLogout()">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>


<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="card card-leads">

        <h2>Leads</h2>

        <div class="contadores-leads">

            <div class="contador-lead">
                <strong id="contadorNovos">0</strong>
                Novos
            </div>

            <div class="contador-lead">
                <strong id="contadorHoje">0</strong>
                Chamados hoje
            </div>

            <div class="contador-lead">
                <strong id="contadorInteressados">0</strong>
                Interessados
            </div>

        </div>

        <p class="ultima-busca" id="ultimaBusca" style="display:none"></p>

        <div class="barra-leads">

            <input
                type="search"
                id="buscaLeads"
                placeholder="🔍 Buscar empresa"
                autocomplete="off"
            >

            <select id="filtroCidade" title="Cidade"></select>

            <select id="filtroSegmento" title="Segmento"></select>

            <select id="filtroPorte" title="Porte"></select>

            <select id="filtroStatus" title="Status"></select>

            <button type="button" class="btn-secundario" onclick="recarregarLeads(true)">
                ↻ Atualizar
            </button>

            <button type="button" class="btn-secundario" onclick="abrirConfigBusca()">
                ⚙️ Configuração de busca
            </button>

        </div>

        <div class="vendedor-leads">

            <label for="nomeVendedor">Seu nome nas mensagens:</label>

            <input type="text" id="nomeVendedor" autocomplete="off">

        </div>

        <!-- quem já está sendo chamado: aparece junto com os novos -->
        <div id="secaoAndamento" style="display:none">

            <h3 class="titulo-secao-lead" id="tituloAndamento"></h3>

            <div class="lista-leads" id="listaAndamento"></div>

            <h3 class="titulo-secao-lead">Novos</h3>

        </div>

        <p class="contagem-leads" id="contagemLeads"></p>

        <div class="lista-leads" id="listaLeads"></div>

        <p class="leads-vazio" id="leadsVazio" style="display:none"></p>

    </div>

</div>


<!-- =========================
MODAL (configuração de busca)
========================= -->

<div id="modalConfigBusca" class="modal-overlay">

    <div class="modal-config-leads">

        <div class="modal-config-topo">

            <h3>⚙️ Configuração de busca</h3>

            <button type="button" onclick="fecharConfigBusca()" title="Fechar">×</button>

        </div>

        <p class="dica-leads">
            O agente externo lê as configurações ativas para encontrar novas empresas.
        </p>

        <div id="listaConfigBusca"></div>

        <div class="form-config-leads">

            <h4 id="tituloFormConfig">Nova configuração</h4>

            <label for="configNome">Nome</label>
            <input type="text" id="configNome" placeholder="Ex: Construtoras do Vale" autocomplete="off">

            <label for="configCidades">Cidades (separadas por vírgula)</label>
            <input type="text" id="configCidades" placeholder="Ex: Itajaí, Brusque, Joinville" autocomplete="off">

            <label for="configUf">UF</label>
            <input type="text" id="configUf" placeholder="Ex: SC" maxlength="2" autocomplete="off">

            <label for="configSegmentos">Segmentos (separados por vírgula)</label>
            <input type="text" id="configSegmentos" placeholder="Ex: Construção civil, Indústria" autocomplete="off">

            <label>Portes</label>
            <div class="portes-config" id="configPortes"></div>

            <label for="configPalavras">Palavras-chave</label>
            <input type="text" id="configPalavras" placeholder="Ex: obra nova, ampliação, galpão" autocomplete="off">

            <div class="botoes-config-leads">

                <button type="button" onclick="salvarConfigBusca()">Salvar</button>

                <button type="button" class="btn-secundario" onclick="limparFormConfig()">Limpar</button>

            </div>

        </div>

    </div>

</div>


<div id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-guard.js"></script>

<script src="js/helpers.js"></script>
<script src="js/atualizacao-sistema.js"></script>
<script src="js/presenca.js"></script>
<script src="js/menu.js"></script>
<script src="js/leads.js"></script>

</body>

</html>
