<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Propostas</title>

<link rel="stylesheet" href="style.css">
<link rel="icon" href="icon.png">

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <button onclick="gerarStatus('FreteZOHO')">
        Frete ZOHO
    </button>

    <button onclick="gerarStatus('FreteZOHOLocComp')">
        Frete ZOHO - Loc Complementar
    </button>

    <a href="index.html" class="botao-topbar">
        ⬅ Voltar
    </a>
        <a href="WEG.html" class="botao-topbar">
        🏢 WEG
    </a>

    <div class="versao" id="versaoSistema"></div>

</div>


<!-- =========================
CONTAINER
========================= -->

<div class="container">


    <!-- =========================
    AGENDAMENTO
    ========================= -->

    <div class="card">

        <h2>Agendamento de Entrega</h2>

        <div class="agendamento-linha">
            <span>🚚 AGENDAMENTO DE ENTREGA</span>
        </div>

        <div class="agendamento-linha">
            <label>Data:</label>
            <input
                type="text"
                id="agData"
                placeholder="hora"
            >
        </div>

        <div class="agendamento-linha">
            <label>Horário:</label>
            <input
                type="text"
                id="agHorario"
                placeholder="hora"
            >
        </div>

        <div class="agendamento-linha">
            <label>Equipamento:</label>
            <input
                type="text"
                id="agEquipamento"
                placeholder="PEMT"
            >
        </div>

        <div class="agendamento-linha">
            <label>Local de Saída:</label>
            <input
                type="text"
                id="agSaida"
                value="WR"
            >
        </div>

        <div class="agendamento-linha">
            <label>Local de entrega:</label>
            <input
                type="text"
                id="agEntrega"
                placeholder="Nome_do_Local"
            >
        </div>

        <div class="agendamento-linha">
            <label>Endereço:</label>
            <input
                type="text"
                id="agEndereco"
                placeholder="Endereço"
            >
        </div>

        <div class="agendamento-linha">

            <label>Contato:</label>

            <div class="duplo">

                <input
                    type="text"
                    id="agContato"
                    placeholder="Nome"
                >

                <input
                    type="text"
                    id="agNumero"
                    placeholder="Número"
                >

            </div>

        </div>


        <div class="linha-agendamento">

            <select
                id="tipoFrete"
                class="input-mini"
            >

                <option value="CLIENTE">
                    Por conta do cliente
                </option>

                <option value="NOSSA">
                    Por nossa conta
                </option>

            </select>

            <input
                type="text"
                id="agendamentoValorFrete"
                class="input-flex"
                placeholder="Valor frete"
            >

        </div>


        <div class="agendamento-linha">

            <label>Nome proposta:</label>

            <input
                type="text"
                id="agNomeProposta"
                placeholder="Nome"
            >

        </div>


        <hr>


        <!-- =========================
        FINANCEIRO
        ========================= -->

        <div id="blocoFinanceiro">

            <div class="financeiro-topo">

                <h3>📍 Financeiro</h3>

                <button
                    type="button"
                    class="btn-add"
                    onclick="adicionarFinanceiro()"
                >
                    +
                </button>

            </div>


            <div id="listaFinanceiros">

                <div class="financeiro-item">

                    <div class="agendamento-linha">

                        <label>Nome:</label>

                        <input
                            type="text"
                            class="financeiroNome"
                        >

                    </div>


                    <div class="agendamento-linha">

                        <label>Telefone:</label>

                        <input
                            type="text"
                            class="financeiroTelefone"
                        >

                    </div>


                    <div class="agendamento-linha">

                        <label>Email:</label>

                        <input
                            type="text"
                            class="financeiroEmail"
                        >

                    </div>


                    <hr>

                </div>

            </div>

        </div>


        <button onclick="copiarAgendamento()">
            Copiar Agendamento
        </button>

    </div>


    <!-- =========================
    COLUNA ESQUERDA
    ========================= -->

    <div class="coluna-esquerda">


        <!-- =========================
        GERAR TEXTOS
        ========================= -->

        <div class="card">

            <h2>Gerar Textos</h2>

            <button
                type="button"
                class="btn-limpar-tudo"
                onclick="limparTudo()"
            >
                🗑️ Limpar tudo
            </button>


            <input
                type="text"
                id="nomeCliente"
                placeholder="Nome do cliente"
            >


            <p id="textoOportunidade"></p>


            <button onclick="copiarTexto('textoOportunidade')">
                Copiar Oportunidade ZOHO
            </button>


            <hr>


            <!-- EQUIPAMENTOS -->

            <div id="listaEquipamentosProposta">

<div class="equipamento-linha" data-equip-id="1">

    <input
        type="text"
        id="equipamento"
        class="equipamento"
        placeholder="Equipamento"
        list="listaEquipamentos"
    >

    <input
        type="text"
        id="quantidadeEquipamento"
        class="quantidadeEquipamento"
        value="1"
        inputmode="numeric"
        title="Quantidade"
    >

    <button
        type="button"
        class="btn-remover-equipamento"
        onclick="removerEquipamento(this)"
        title="Remover"
    >
        −
    </button>

    <button
        type="button"
        class="btn-add-equipamento"
        onclick="adicionarEquipamento()"
    >
        +
    </button>

</div>

            </div>


            <!-- Preenchida sozinha via JS (preencherListaEquipamentos),
                 a partir dos modelos que existem no tabela.csv -->
            <datalist id="listaEquipamentos"></datalist>


            <!-- PERÍODO -->

            <input
                type="text"
                id="periodo"
                placeholder="Período"
            >


            <!-- CIDADE -->

            <input
                type="text"
                id="cidade"
                placeholder="Cidade"
                list="listaCidades"
            >


            <!-- Preenchida sozinha via JS (preencherListaCidades),
                 a partir das cidades que existem nos arquivos de frete -->
            <datalist id="listaCidades"></datalist>


            <!-- FRETE -->

            <input
                type="text"
                id="valorFrete"
                placeholder="Valor frete"
            >


            <p id="textoOrcamento"></p>


            <button onclick="copiarTexto('textoOrcamento')">
                Copiar Proposta ZOHO
            </button>


            <br><br>


            <button onclick="copiarPropostaZap()">
                Copiar Proposta Zap
            </button>

        </div>


        <!-- =========================
        DESCONTO
        ========================= -->

        <div class="card desconto-card">

            <h2>Calcular Desconto</h2>

            <div id="listaDescontosEquipamentos">
                <p class="desconto-placeholder" style="color:#94a3b8">
                    Adicione um equipamento e o período pra calcular.
                </p>
            </div>

            <hr>

            <p>
                Valor final da proposta:
                <span id="valorFinalProposta"></span>
            </p>

        </div>

    </div>


    <!-- =========================
    FRETES
    ========================= -->

    <div
        id="painelFretes"
        class="painel-fretes"
    >

        <h3>Fretes encontrados</h3>

        <div id="resultadoFretes">
            Nenhum frete consultado
        </div>

    </div>

</div>


<div id="toast"></div>


<script src="helpers.js"></script>
<script src="propostas-dados.js"></script>
<script src="propostas-textos.js"></script>

</body>

</html>
