<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://qhneylwmrzuesaloqetr.supabase.co wss://qhneylwmrzuesaloqetr.supabase.co https://get.geojs.io; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- já abre a conexão com o banco enquanto os arquivos baixam -->
<link rel="preconnect" href="https://qhneylwmrzuesaloqetr.supabase.co" crossorigin>

<title>WEG - Contrato</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <button data-clique="fazerLogout">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>


<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="card">

        <h2>Contrato WEG</h2>

        <p style="color:#94a3b8; font-size:13px; margin-top:-8px;">
            Preços fixos em contrato. Cada período = 30 dias. Frete bonificado a partir de 4 períodos.
        </p>

        <hr>

        <!-- EQUIPAMENTOS -->

        <div id="listaEquipamentosWEG"></div>

        <hr>

        <!-- FRETE -->

        <div class="agendamento-linha">
            <label>Unidade WEG (frete):</label>
            <select id="unidadeWEG"></select>
        </div>

        <div class="agendamento-linha">
            <label>Valor do frete:</label>
            <input
                type="text"
                id="valorFrete"
                placeholder="Ex: 450,00"
            >
        </div>

        <hr>

        <!-- PERÍODOS -->

        <div class="agendamento-linha">
            <label>Períodos (30 dias):</label>
            <input
                type="number"
                id="periodos"
                value="1"
                min="1"
                step="1"
            >
        </div>

        <!-- DATAS -->

        <div class="agendamento-linha">
            <label>Data início:</label>
            <input
                type="date"
                id="dataInicio"
            >
        </div>

    </div>


    <!-- =========================
    DOCUMENTO (área pra print)
    ========================= -->

    <div class="coluna-documento">

        <!-- fora da área de print: título do orçamento e texto pra mandar junto no e-mail -->
        <div class="acoes-documento">

            <span class="titulo-orcamento-weg" id="tituloWEG" title="Título do orçamento (mesmo padrão da Proposta ZOHO)"></span>

            <button
                class="btn-copiar-email"
                data-clique="copiarTituloWEG"
                title="Copia o título do orçamento: WEG UNIDADE_MODELOS_PERÍODO"
            >📋 Copiar título</button>

            <button
                class="btn-copiar-email"
                data-clique="copiarParaEmail"
                title="Copia a saudação e os dados para confirmação"
            >📋 Copiar texto do e-mail</button>

        </div>

        <div
            id="documentoProposta"
            class="documento-proposta"
        ></div>

    </div>

</div>


<div id="toast"></div>


<script src="js/vendor/supabase-2.45.0.js" defer></script>
<script src="js/acoes.js" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/registro-erros.js" defer></script>
<script src="js/arquivo-faltando.js" defer></script>
<script src="js/dispositivo.js" defer></script>
<script src="js/auth-guard.js" defer></script>

<script src="js/helpers.js" defer></script>
<script src="js/atualizacao-sistema.js" defer></script>
<script src="js/presenca.js" defer></script>
<script src="js/menu.js" defer></script>
<script src="js/weg/weg-dados.js" defer></script>
<script src="js/weg/weg-documento.js" defer></script>
<script src="js/weg/weg-cache.js" defer></script>
<script src="js/weg/weg-email.js" defer></script>
<script src="js/weg/weg-titulo.js" defer></script>
<script src="js/weg/weg-init.js" defer></script>

</body>

</html>
