<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://qhneylwmrzuesaloqetr.supabase.co wss://qhneylwmrzuesaloqetr.supabase.co https://get.geojs.io; object-src 'none'; base-uri 'self'; form-action 'self'">

<title>Estoque</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

<link rel="stylesheet" href="css/estoque.css">

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <button data-clique="fazerLogout">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>


<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="estoque-pagina">

        <div class="card card-estoque-topo">

            <div class="estoque-topo-linha">

                <h2 id="tituloEstoque">Estoque de plataformas</h2>

                <div class="troca-filial">

                    <button
                        type="button"
                        class="btn-filial ativo"
                        data-filial="ITAJAI"
                        data-clique="trocarFilial" data-arg="ITAJAI"
                    >
                        Itajaí
                    </button>

                    <button
                        type="button"
                        class="btn-filial"
                        data-filial="JOINVILLE"
                        data-clique="trocarFilial" data-arg="JOINVILLE"
                    >
                        Joinville
                    </button>

                </div>

            </div>

            <p class="estoque-atualizado" id="estoqueAtualizado">
                Carregando...
            </p>

            <div class="barra-upload">

                <button type="button" id="btnEnviarEstoque">
                    📤 Enviar planilha do estoque
                </button>

                <input
                    type="file"
                    id="arquivoEstoque"
                    accept=".xlsx,.xls"
                    class="oculto"
                >

                <span class="dica">
                    Suba o Excel bruto do estoque. Você confere a prévia antes de publicar.
                </span>

            </div>

            <div class="barra-busca">

                <input
                    type="text"
                    id="buscaModelo"
                    placeholder="🔍 Buscar modelo (ex: WAD26)"
                    autocomplete="off"
                >

            </div>

            <p class="avisos-estoque oculto" id="avisosEstoque"></p>

        </div>

        <div class="faixa-previa oculto" id="faixaPrevia">

            <span id="textoPrevia"></span>

            <button
                type="button"
                class="btn-publicar"
                id="btnPublicar"
                data-clique="publicarResumo"
            >
                ✅ Publicar
            </button>

            <button
                type="button"
                class="btn-cancelar"
                data-clique="cancelarPrevia"
            >
                Cancelar
            </button>

        </div>

        <div class="grade-estoque" id="resumoEstoque"></div>

    </div>

</div>


<div id="toast"></div>


<script src="js/vendor/supabase-2.45.0.js" defer></script>
<script src="js/acoes.js" defer></script>
<script src="js/vendor/xlsx-0.18.5.full.min.js" defer></script>

<script src="js/arquivo-faltando.js" defer></script>

<script src="js/auth-guard.js" defer></script>

<script src="js/helpers.js" defer></script>
<script src="js/atualizacao-sistema.js" defer></script>
<script src="js/presenca.js" defer></script>
<script src="js/menu.js" defer></script>
<script src="js/estoque/estoque-config.js" defer></script>
<script src="js/estoque/estoque-parser.js" defer></script>
<script src="js/estoque/estoque-grupos.js" defer></script>
<script src="js/estoque/estoque-render.js" defer></script>
<script src="js/estoque/estoque-busca.js" defer></script>
<script src="js/estoque/estoque-dados.js" defer></script>
<script src="js/estoque/estoque-upload.js" defer></script>
<script src="js/estoque/estoque-init.js" defer></script>

</body>

</html>
