<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://qhneylwmrzuesaloqetr.supabase.co wss://qhneylwmrzuesaloqetr.supabase.co https://get.geojs.io; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- já abre a conexão com o banco enquanto os arquivos baixam -->
<link rel="preconnect" href="https://qhneylwmrzuesaloqetr.supabase.co" crossorigin>
<title>Ferramentas</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">
</head>

<body>

<div class="topbar">

    <button data-clique="fazerLogout">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>

<div class="container">

    <!-- Conversor -->
    <div class="card">

        <h2>Conversor de Texto</h2>

        <textarea id="texto" placeholder="Digite algo..."></textarea>

        <div class="botoes">
            <button data-clique="maiusculo">MAIÚSCULO</button>
            <button data-clique="minusculo">minúsculo</button>
            <button data-clique="formatarCNPJ">formatar CNPJ</button>
        </div>

    </div>

    <!-- Calculadora -->
    <div class="card">

        <h2>Calculadora de Boletos</h2>

        <div class="linha-topo">

            <input type="date" id="data">

            <input
                type="text"
                id="valor"
                placeholder="Valor (ex: 100.50)"
            >

            <input
                type="number"
                id="parcelas"
                value="2"
                min="1"
                title="Quantidade de parcelas"
                style="max-width:80px"
            >

        </div>

        <div class="linha-resultado">

            <div class="datas">
                <p>28 dias: <span id="d28"></span></p>
                <p>42 dias: <span id="d42"></span></p>
                <p>56 dias: <span id="d56"></span></p>
            </div>

            <div class="valor-lado">
                <p>Parcelas</p>
                <span id="metade"></span>
            </div>

        </div>

        <hr>

        <input
            type="number"
            id="dias"
            placeholder="Dias personalizados"
        >

        <p>
            Resultado:
            <span id="resultadoDias"></span>
        </p>

    </div>

</div>

<!-- STATUS -->
<div class="status-bar">

    <button data-clique="gerarStatus" data-arg="autorizado">
    Autorizado 📝
</button>

<button data-clique="gerarStatus" data-arg="ICMS">
    ICMS
</button>

</div>

<div id="toast"></div>

<script src="js/vendor/supabase-2.45.0.js" defer></script>
<script src="js/acoes.js" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/registro-erros.js" defer></script>
<script src="js/arquivo-faltando.js" defer></script>
<script src="js/dispositivo.js" defer></script>
<script src="js/auth-guard.js" defer></script>

<script src="js/helpers.js" defer></script>
<script src="js/atualizacao-sistema.js" defer></script>
<script src="js/presenca.js" defer></script>
<script src="js/status.js" defer></script>
<script src="js/index/index-ferramentas.js" defer></script>
<script src="js/menu.js" defer></script>

</body>
</html>
