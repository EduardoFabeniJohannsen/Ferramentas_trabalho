<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://qhneylwmrzuesaloqetr.supabase.co wss://qhneylwmrzuesaloqetr.supabase.co https://get.geojs.io https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- já abre a conexão com o banco enquanto os arquivos baixam -->
<link rel="preconnect" href="https://qhneylwmrzuesaloqetr.supabase.co" crossorigin>
<title>Login</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">
</head>

<body>

<div class="container" style="padding-top:120px;">

    <div class="card" style="width:320px;">

        <h2>Login</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="E-mail"
            autocomplete="username"
        >

        <input
            type="password"
            id="loginSenha"
            placeholder="Senha"
            autocomplete="current-password"
        >

        <!-- captcha da Cloudflare (login-captcha.js): só aparece quando ela desconfia -->
        <div id="captchaLogin"></div>

        <button data-clique="fazerLogin">Entrar</button>

        <p id="loginErro" style="color:#ef4444; font-size:13px; margin-top:8px;"></p>

    </div>

</div>

<script src="js/vendor/supabase-2.45.0.js" defer></script>
<script src="js/acoes.js" defer></script>
<script src="js/supabase-config.js" defer></script>

<script src="js/login/login-captcha.js" defer></script>
<script src="js/login/login.js" defer></script>

</body>
</html>
