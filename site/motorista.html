========================= -->

<!-- =========================
CONTAINER (login de motorista: acesso "motorista" no Admin, e o admin)
========================= -->

<div class="container">

    <div class="card card-motorista">

        <h2>🚛 Minhas entregas</h2>

        <!-- nome e transportadora do motorista do login (motorista-tela.js) -->
        <p class="motorista-quem" id="motoristaQuem"></p>

        <!-- só o admin: ver as entregas de qualquer motorista (motorista-dados.js) -->

            Ver como o motorista
            <select id="motoristaVerComoSelect" data-mudanca="trocarVerComoMotorista"></select>
        </label>

        <div class="motorista-barra">

            <button type="button" id="btnAtualizarMotorista" data-clique="carregarEntregasMotorista">
                ↻ Atualizar
            </button>

            <span class="motorista-atualizado" id="motoristaAtualizado"></span>

        </div>

        <!-- as entregas por dia (motorista-tela.js) -->
        <div id="listaMotorista" class="lista-motorista"></div>

    </div>

</div>
