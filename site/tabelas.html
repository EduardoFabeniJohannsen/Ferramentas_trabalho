<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://qhneylwmrzuesaloqetr.supabase.co wss://qhneylwmrzuesaloqetr.supabase.co https://get.geojs.io; object-src 'none'; base-uri 'self'; form-action 'self'">

<title>Tabelas</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

<link rel="stylesheet" href="css/tabelas.css">

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <button data-clique="fazerLogout">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>


<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="card card-tabelas">

        <h2 id="tituloTabelas" style="text-align:center">Tabelas</h2>

        <div class="barra-tabelas">

            <select id="selectTabela"></select>

            <input
                type="text"
                id="filtroTabela"
                placeholder="Filtrar (modelo, cidade, transportadora...)"
            >

            <button
                type="button"
                id="btnModoEdicao"
                data-clique="alternarModoEdicao"
                style="display:none; margin:0"
            >
                ✏️ Editar
            </button>

            <span class="contagem" id="contagemTabela"></span>

        </div>

        <div class="area-tabela">

            <table class="tabela-editor">

                <thead id="cabecalhoTabela"></thead>

                <tbody id="corpoTabela"></tbody>

            </table>

        </div>

        <p id="avisoEdicao" style="color:#94a3b8; font-size:12px"></p>

    </div>

</div>


<div id="toast"></div>


<script src="js/vendor/supabase-2.45.0.js"></script>
<script src="js/acoes.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/registro-erros.js"></script>
<script src="js/arquivo-faltando.js"></script>
<script src="js/dispositivo.js"></script>
<script src="js/auth-guard.js"></script>

<script src="js/helpers.js"></script>
<script src="js/atualizacao-sistema.js"></script>
<script src="js/presenca.js"></script>
<script src="js/menu.js"></script>
<script src="js/tabelas/tabelas-config.js"></script>
<script src="js/tabelas/tabelas-dados.js"></script>
<script src="js/tabelas/tabelas-desenho.js"></script>
<script src="js/tabelas/tabelas-editor.js"></script>
<script src="js/tabelas/tabelas-init.js"></script>

</body>

</html>
