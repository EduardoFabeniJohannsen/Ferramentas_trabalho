<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://qhneylwmrzuesaloqetr.supabase.co wss://qhneylwmrzuesaloqetr.supabase.co https://get.geojs.io; object-src 'none'; base-uri 'self'; form-action 'self'">

<title>Transportadoras</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

<link rel="stylesheet" href="css/transportadoras.css">

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <!-- links das outras páginas: montados pelo js/menu.js -->

    <button data-clique="fazerLogout">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>


<!-- =========================
CONTAINER (só aparece depois de conferir se é admin ou só vê)
========================= -->

<div class="container" id="conteudoTransp" style="display:none">

    <div class="card card-transp">

        <h2 style="text-align:center">Transportadoras</h2>

        <p class="dica-transp" id="dicaTransp">
            Área restrita ao admin. Cadastro de transportadoras, veículos, motoristas e PDFs da documentação.
        </p>

        <div class="barra-transp">

            <select id="selectTransportadora"></select>

            <button
                type="button"
                class="btn-secundario"
                id="btnNovaTransportadora"
                data-clique="abrirFormNovaTransp"
            >
                + Nova transportadora
            </button>

            <button
                type="button"
                class="btn-secundario"
                id="btnExcluirTransportadora"
                data-clique="excluirTransportadoraAtual"
                title="Excluir a transportadora selecionada (só se não tiver motorista, veículo nem agendamento)"
            >
                🗑️ Excluir transportadora
            </button>

            <button type="button" id="btnNovoItem" data-clique="abrirNovoItemTransp">
                + Novo veículo
            </button>

        </div>

        <div class="nova-transp" id="formNovaTransp" style="display:none">

            <input
                type="text"
                id="nomeNovaTransp"
                placeholder="Nome da transportadora"
                maxlength="60"
                autocomplete="off"
            >

            <button type="button" data-clique="adicionarTransportadoraTransp">
                Adicionar
            </button>

            <button type="button" class="btn-secundario" data-clique="fecharFormNovaTransp">
                Cancelar
            </button>

        </div>

        <div class="abas-transp">

            <button
                type="button"
                id="abaVeiculos"
                class="aba-btn"
                data-clique="definirAbaTransp" data-arg="veiculos"
            >
                🚛 Veículos
            </button>

            <button
                type="button"
                id="abaMotoristas"
                class="aba-btn"
                data-clique="definirAbaTransp" data-arg="motoristas"
            >
                🧑 Motoristas
            </button>

        </div>

        <p class="contagem-transp" id="contagemTransp"></p>

        <div id="listaTransp"></div>

    </div>

</div>


<!-- =========================
MODAL (veículo / motorista)
========================= -->

<div
    id="modalTransp"
    class="modal-overlay"
    data-clique-fora="fecharModalTransp"
>

    <div class="modal-transp">

        <div class="modal-transp-topo">

            <h3 id="tituloModalTransp"></h3>

            <div class="modal-acoes">

                <button type="button" id="btnSalvarTransp" data-clique="salvarModalTransp">
                    💾 Salvar
                </button>

                <button
                    type="button"
                    class="btn-fechar"
                    data-clique="fecharModalTransp"
                    title="Fechar"
                >
                    ×
                </button>

            </div>

        </div>

        <div class="modal-transp-corpo" id="corpoModalTransp"></div>

    </div>

</div>


<div id="toast"></div>


<script src="js/vendor/supabase-2.45.0.js"></script>
<script src="js/acoes.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/registro-erros.js"></script>
<script src="js/arquivo-faltando.js"></script>
<script src="js/auth-guard.js"></script>

<script src="js/helpers.js"></script>
<script src="js/atualizacao-sistema.js"></script>
<script src="js/presenca.js"></script>
<script src="js/menu.js"></script>
<script src="js/transportadoras/transp-config.js"></script>
<script src="js/transportadoras/transp-banco.js"></script>
<script src="js/transportadoras/transp-cad-banco.js"></script>
<script src="js/transportadoras/transp-docs.js"></script>
<script src="js/transportadoras/transp-render.js"></script>
<script src="js/transportadoras/transp-form.js"></script>
<script src="js/transportadoras/transp-form-veiculo.js"></script>
<script src="js/transportadoras/transp-form-motorista.js"></script>
<script src="js/transportadoras/transp-cad-tela.js"></script>
<script src="js/transportadoras/transp-init.js"></script>

</body>

</html>
