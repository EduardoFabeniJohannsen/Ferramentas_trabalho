<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Tabelas</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

<link rel="stylesheet" href="css/tabelas.css">

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <button onclick="fazerLogout()">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>


<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="card card-tabelas">

        <h2 id="tituloTabelas" style="text-align:center">Tabelas</h2>

        <div class="barra-tabelas">

            <select id="selectTabela"></select>

            <input
                type="text"
                id="filtroTabela"
                placeholder="Filtrar (modelo, cidade, transportadora...)"
            >

            <button
                type="button"
                id="btnModoEdicao"
                onclick="alternarModoEdicao()"
                style="display:none; margin:0"
            >
                ✏️ Editar
            </button>

            <span class="contagem" id="contagemTabela"></span>

        </div>

        <div class="area-tabela">

            <table class="tabela-editor">

                <thead id="cabecalhoTabela"></thead>

                <tbody id="corpoTabela"></tbody>

            </table>

        </div>

        <p id="avisoEdicao" style="color:#94a3b8; font-size:12px"></p>

    </div>

</div>


<div id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-guard.js"></script>

<script src="js/helpers.js"></script>
<script src="js/menu.js"></script>
<script src="js/tabelas-config.js"></script>
<script src="js/tabelas-dados.js"></script>
<script src="js/tabelas-desenho.js"></script>
<script src="js/tabelas-editor.js"></script>
<script src="js/tabelas-init.js"></script>

</body>

</html>
