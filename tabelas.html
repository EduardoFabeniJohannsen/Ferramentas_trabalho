<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Tabelas</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.png">

<style>
/* ===== Editor de tabelas (admin) ===== */
.card-tabelas{
    width:100%;
    max-width:1000px;
    text-align:left;
}
.barra-tabelas{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:12px;
}
.barra-tabelas select,
.barra-tabelas input{
    width:auto;
    margin:0;
    flex:1;
    min-width:160px;
}
.barra-tabelas .contagem{
    color:#94a3b8;
    font-size:13px;
}
.area-tabela{
    max-height:60vh;
    overflow:auto;
    border:1px solid #334155;
    border-radius:8px;
}
.tabela-editor{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}
.tabela-editor th{
    position:sticky;
    top:0;
    background:#0f172a;
    text-align:left;
    padding:8px;
    border-bottom:1px solid #334155;
}
.tabela-editor td{
    padding:4px;
    border-bottom:1px solid #334155;
}
.tabela-editor input{
    margin:0;
    padding:6px 8px;
    font-size:14px;
}
.tabela-editor input.salvando{
    border-color:#eab308;
}
.tabela-editor input.erro{
    border-color:#ef4444;
}
.tabela-editor .col-id{
    width:60px;
    color:#94a3b8;
}
.tabela-editor .col-acao{
    width:50px;
    text-align:center;
}
.tabela-editor .btn-excluir{
    margin:0;
    padding:4px 10px;
    background:#dc2626;
}
.tabela-editor .btn-excluir:hover{
    background:#b91c1c;
}
.tabela-editor tr.linha-nova td{
    background:#1e3a2f;
}
.tabela-editor .btn-adicionar{
    margin:0;
    padding:6px 10px;
    background:#16a34a;
}
.tabela-editor .btn-adicionar:hover{
    background:#15803d;
}
</style>

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

    <a href="propostas.html" class="botao-topbar">
        ⬅ Voltar
    </a>

    <button onclick="fazerLogout()">Sair</button>

    <div class="versao" id="versaoSistema"></div>

</div>


<!-- =========================
CONTAINER
========================= -->

<div class="container">

    <div class="card card-tabelas">

        <h2 style="text-align:center">Editar tabelas</h2>

        <div class="barra-tabelas">

            <select id="selectTabela"></select>

            <input
                type="text"
                id="filtroTabela"
                placeholder="Filtrar (modelo, cidade, transportadora...)"
            >

            <span class="contagem" id="contagemTabela"></span>

        </div>

        <div class="area-tabela">

            <table class="tabela-editor">

                <thead id="cabecalhoTabela"></thead>

                <tbody id="corpoTabela"></tbody>

            </table>

        </div>

        <p style="color:#94a3b8; font-size:12px">
            A alteração é salva sozinha ao sair do campo.
        </p>

    </div>

</div>


<div id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-guard.js"></script>

<script src="js/helpers.js"></script>
<script src="js/tabelas.js"></script>

</body>

</html>
